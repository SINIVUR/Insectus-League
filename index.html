<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="곤충을 잡고, 기르고, 배틀하는 곤충 육성 배틀 RPG">
<meta name="theme-color" content="#0E1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인섹터스 리그">
<meta name="version" content="0.0.4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>인섹터스 리그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 16:9 무대 하나를 화면에 맞춰 축소·확대하는 게임 프레임. 만화 원고지 + 잉크 + 경기장 밤 */
:root {
  --night: #0E1220;
  --paper: #EFE8D8;
  --ink: #111114;
  --red: #C8232C;
  --lime: #B8F24A;
  --sky: #4FD1FF;
  --gold: #FFD23F;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: #F4F7FB; font-family: var(--body);
  overflow: hidden; box-sizing: border-box; padding: 0;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#bg, #bugs, #actors, #front { touch-action: none; }
.berserk .b-img svg { filter: drop-shadow(0 0 8px #B04AFF) drop-shadow(0 0 20px #7A1AE0) saturate(1.25); animation: bzk 1.2s ease-in-out infinite alternate; }
@keyframes bzk { from { filter: drop-shadow(0 0 6px #B04AFF) drop-shadow(0 0 14px #7A1AE0) saturate(1.2) } to { filter: drop-shadow(0 0 14px #D08AFF) drop-shadow(0 0 30px #9A3AFF) saturate(1.5) } }
.tn { background: rgba(8,10,18,.86); display: flex; align-items: center; justify-content: center; }
.tn-box { position: relative; width: 680px; align-items: stretch; gap: 14px; }
.tn-p { margin: 0; font-size: 19px; font-weight: 700; color: #4A4A52; }
#tnIn { height: 64px; padding: 0 18px; border: 4px solid var(--ink); font-size: 30px; font-weight: 900; font-family: inherit; text-align: center; user-select: text; -webkit-user-select: text; }
.tn-sug { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; } .tn-sug .btn { font-size: 17px; }
.tn-err { margin: 0; min-height: 22px; color: #C8232C; font-weight: 900; text-align: center; }
.rstar { padding: 2px 10px; background: linear-gradient(#FFE27A, #F0A818); color: #3A2400; border: 2px solid #3A2400; font-size: 16px; font-weight: 900; white-space: nowrap; }
.rs { color: #FFD23F; }
.rare-banner { align-self: center; padding: 6px 18px; background: linear-gradient(#FFE27A, #F0A818); color: #3A2400; border: 3px solid var(--ink); font-size: 22px; font-weight: 900; animation: rareGlow 1s ease-in-out infinite alternate; }
@keyframes rareGlow { from { box-shadow: 0 0 0 rgba(255,210,63,0) } to { box-shadow: 0 0 22px rgba(255,210,63,.9) } }
.catch-bug.rare { filter: drop-shadow(0 0 14px rgba(255,200,40,.85)); }
.rel { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: radial-gradient(circle at 50% 45%, #2E5A2A 0%, #14261A 55%, #0A120C 100%); color: #fff; animation: fade .4s ease-out; overflow: hidden; }
.rel-scene { width: 900px; height: 330px; display: flex; align-items: center; justify-content: center; }
.rel b { font-family: var(--display); font-weight: 400; font-size: 48px; } .rel p { margin: 0; font-size: 22px; font-weight: 700; } .rel small { font-size: 16px; color: #9AA3B5; }
.rel-bug svg { width: 420px; height: 262px; }
.rel-walk .rel-bug { animation: relWalk 3s ease-in .4s forwards; }
.rel-fly .rel-bug { animation: relFly 3s ease-in .4s forwards; }
.rel-swim .rel-bug { animation: relSwim 3s ease-in .4s forwards; }
@keyframes relWalk { 0% { transform: none; opacity: 1 } 15% { transform: translateY(-10px) } 100% { transform: translateX(620px); opacity: 0 } }
@keyframes relFly { 0% { transform: none; opacity: 1 } 20% { transform: translateY(-20px) } 100% { transform: translate(560px, -420px) scale(.35); opacity: 0 } }
@keyframes relSwim { 0% { transform: none; opacity: 1 } 100% { transform: translate(560px, 120px) scale(.7); opacity: 0 } }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #000; }
.layer { position: absolute; inset: 0; }
#world { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.enc-bg svg, .b-arena svg { display: block; width: 100%; height: 100%; }
.b-ask { margin-left: 8px; color: var(--gold); }
#bg { z-index: 1; } #bugs { z-index: 2; } #actors { z-index: 3; } #front { z-index: 4; pointer-events: none; }
#hud { z-index: 20; pointer-events: none; } #hud button { pointer-events: auto; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

.actor { position: absolute; width: 200px; height: 260px; transform-origin: 0 0; transition: left .5s ease, top .5s ease, filter .2s; }
.actor .flip { width: 200px; height: 260px; transform-origin: 50% 50%; }
.actor .inner { width: 200px; height: 260px; transform-origin: 50% 100%; }
.actor.dim { filter: brightness(.68) saturate(.8); }
.actor.talk .inner { animation: hop .35s ease-out; }
.actor.pop .inner { animation: popin .45s ease-out; }
.field .actor { transition: filter .2s; }
.actor.walk .inner { animation: walk .36s ease-in-out infinite; }
@keyframes hop { 0% { transform: translateY(0) } 40% { transform: translateY(-14px) } 100% { transform: translateY(0) } }
@keyframes popin { 0% { transform: scale(.2); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }
@keyframes walk { 0%,100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-7px) rotate(-3deg) } 75% { transform: translateY(-7px) rotate(3deg) } }

.place-chip { position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; background: var(--ink); border: 3px solid var(--paper); color: #fff; }
.place-chip small { font-size: 15px; font-weight: 700; color: #C9BFA8; letter-spacing: .04em; }
.place-chip b { font-family: var(--display); font-weight: 400; font-size: 22px; }

#menuBtn { position: absolute; right: 24px; top: 24px; z-index: 40; height: 48px; padding: 0 18px; background: var(--ink); color: #fff; border: 3px solid var(--paper); font-size: 19px; font-weight: 900; }

#dlg { position: absolute; left: 180px; right: 180px; bottom: 28px; min-height: 124px; box-sizing: border-box; background: #fff; color: var(--ink); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 26px 32px 20px; z-index: 30; }
#dlg.narr { background: var(--ink); color: #F4F1EA; border-color: var(--paper); box-shadow: 8px 8px 0 rgba(0,0,0,.45); }
#tag { position: absolute; left: 20px; top: -22px; padding: 4px 16px; font-family: var(--display); font-size: 22px; }
#dlgText { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.55; white-space: pre-line; min-height: 68px; }
#more { position: absolute; right: 22px; bottom: 12px; font-size: 19px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0 } }

#choices { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 35; }
.choice { min-width: 440px; height: 66px; font-size: 22px; font-weight: 900; color: var(--ink); background: #fff; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--red); }
.choice:hover { background: var(--gold); }

.ov { position: absolute; inset: 0; z-index: 50; }

/* 로딩 */
.loading { background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.loading h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 72px; color: #fff; text-shadow: 6px 6px 0 var(--red); }
.track { position: relative; width: 560px; height: 14px; background: #2A2A32; border: 3px solid var(--paper); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); }
.track .walker { position: absolute; top: -52px; width: 96px; height: 60px; margin-left: -60px; }
.track .walker svg { width: 96px; height: 60px; }
.loading .pct { font-family: var(--display); font-size: 22px; color: var(--paper); font-variant-numeric: tabular-nums; }
.loading .tip { max-width: 640px; text-align: center; font-size: 20px; line-height: 1.6; color: #C9C3B4; min-height: 54px; }
.loading .press { font-size: 22px; font-weight: 900; color: var(--gold); animation: blink 1.2s steps(2) infinite; }

/* 타이틀 */
.title { background: var(--paper); color: var(--ink); overflow: hidden; }
.title .speed { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 72% 46%, #16161A 0deg .9deg, rgba(0,0,0,0) .9deg 7deg); }
.title .mask { position: absolute; inset: 0; background: radial-gradient(circle at 72% 46%, var(--paper) 0 24%, rgba(239,232,216,0) 62%); }
.title .left { position: absolute; left: 0; top: 0; width: 50%; height: 720px; background: var(--paper); }
.title .tone { position: absolute; left: 0; bottom: 0; width: 700px; height: 280px; background-image: radial-gradient(#16161A 1.6px, rgba(0,0,0,0) 1.9px); background-size: 10px 10px; opacity: .16; }
.title .rule { position: absolute; left: 50%; top: 0; width: 8px; height: 720px; background: var(--ink); }
.title .text { position: absolute; left: 64px; top: 64px; width: 520px; display: flex; flex-direction: column; gap: 16px; }
.title .chip { align-self: flex-start; padding: 6px 14px; background: var(--red); color: #fff; font-size: 18px; font-weight: 900; letter-spacing: .04em; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 118px; line-height: .95; text-shadow: 6px 6px 0 var(--red); }
.title p { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.5; }
.menu { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; width: 300px; }
.menu button { height: 54px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 21px; font-weight: 700; text-align: left; padding: 0 22px; }
.menu button.primary { background: var(--ink); color: #fff; font-size: 22px; font-weight: 900; box-shadow: 6px 6px 0 var(--red); }
.menu button:disabled { opacity: .4; cursor: default; }
.menu button.big { height: 70px; font-size: 26px; } .menu button.big small { font-size: 19px; font-weight: 700; color: #C9BFA8; margin-left: 8px; }
.menu button.ghost { height: 42px; margin-top: 10px; background: transparent; border: 2px solid rgba(17,17,20,.25); color: rgba(17,17,20,.45); font-size: 19px; font-weight: 700; box-shadow: none; }
.menu button.ghost.armed { color: var(--red); border-color: var(--red); background: #fff; }
.sprite { position: absolute; transform-origin: 0 0; }

/* 챕터 카드 */
.chapter { background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; animation: fade .6s ease-out; }
.chapter span { padding: 6px 16px; background: var(--red); color: #fff; font-size: 22px; font-weight: 900; }
.chapter h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 84px; color: #fff; text-wrap: balance; }
.chapter i { width: 380px; height: 4px; background: var(--paper); }
.chapter small { font-size: 19px; color: #C9C3B4; animation: blink 1.2s steps(2) infinite; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* 메뉴·설정 */
.dim-ov { background: rgba(8,10,18,.72); display: flex; align-items: center; justify-content: center; }
.panel { width: 520px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 var(--red); padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 21px; font-weight: 700; }
.seg { display: flex; border: 3px solid var(--ink); }
.seg button { height: 44px; padding: 0 14px; border: 0; background: #fff; color: var(--ink); font-size: 19px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.panel .wide { height: 52px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 21px; font-weight: 900; }
.panel .wide.primary { background: var(--ink); color: #fff; }
.panel .wide.warn { color: var(--red); }

/* 필드 */
.f-count { position: absolute; right: 150px; top: 24px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--ink); border: 3px solid var(--paper); color: #fff; font-weight: 900; font-size: 19px; }
.f-slot { width: 60px; height: 40px; background: #2A2A32; border: 2px solid #5A5A66; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f-slot svg { width: 58px; height: 36px; }
.f-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 18px; background: rgba(17,17,20,.86); border: 3px solid var(--paper); color: #fff; font-size: 20px; font-weight: 700; white-space: nowrap; }
#actBtn { position: absolute; right: 36px; bottom: 36px; width: 128px; height: 128px; border-radius: 50%; border: 5px solid var(--ink); background: #5A5A66; color: #D8D8DE; font-family: var(--display); font-size: 30px; box-shadow: 6px 6px 0 var(--ink); }
#actBtn.ready { background: var(--gold); color: var(--ink); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07) } }
.spark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; animation: twinkle 1.1s ease-in-out infinite; pointer-events: none; }
@keyframes twinkle { 0%,100% { transform: scale(.7) rotate(0); opacity: .6 } 50% { transform: scale(1.15) rotate(20deg); opacity: 1 } }
#bang { position: absolute; width: 40px; height: 48px; margin-left: -20px; font-family: var(--display); font-size: 34px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
.bug { position: absolute; width: 480px; height: 300px; transform-origin: 50% 50%; pointer-events: none; }

.catch { background: rgba(8,10,18,.78); display: flex; align-items: center; justify-content: center; }
.catch-card { position: relative; width: 620px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 var(--gold); padding: 26px 34px 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: popin .45s ease-out; }
.catch-bug { width: 480px; height: 300px; margin: -10px 0 -20px; animation: spinin .7s ease-out; }
@keyframes spinin { from { transform: scale(.3) rotate(-25deg); opacity: 0 } to { transform: none; opacity: 1 } }
.catch-card .type { padding: 4px 12px; background: var(--ink); color: #fff; font-size: 17px; font-weight: 900; }
.catch-card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; }
.catch-card .where { margin: 0; font-size: 18px; font-weight: 700; color: #4A4A52; }
.catch-card .fact { margin: 0; font-size: 20px; line-height: 1.6; max-width: 520px; }
.catch-card button { margin-top: 8px; height: 56px; padding: 0 30px; border: 4px solid var(--ink); background: var(--ink); color: #fff; font-size: 22px; font-weight: 900; box-shadow: 5px 5px 0 var(--red); }

.end { background: var(--paper); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.end .chip { padding: 6px 16px; background: var(--red); color: #fff; font-size: 21px; font-weight: 900; }
.end h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 64px; text-shadow: 5px 5px 0 var(--gold); }
.team { display: flex; gap: 20px; }
.team div { width: 250px; background: #fff; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 10px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.team svg { width: 224px; height: 140px; }
.team b { font-size: 22px; } .team small { font-size: 16px; font-weight: 700; color: #4A4A52; }
.end p { margin: 0; font-size: 21px; font-weight: 700; }
.end .btns { display: flex; gap: 14px; }
.end .btns button { height: 54px; padding: 0 26px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 21px; font-weight: 900; }
.end .btns button.primary { background: var(--ink); color: #fff; box-shadow: 5px 5px 0 var(--red); }

/* 채집 조우 */
.enc { background: #0B0F0A; overflow: hidden; }
.enc-bg { position: absolute; inset: -30px; filter: blur(7px) brightness(.55) saturate(.9); }
.enc-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 100%); }
.enc-top { position: absolute; left: 24px; right: 24px; top: 22px; display: flex; justify-content: space-between; align-items: center; }
.enc-name { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--ink); border: 3px solid var(--paper); }
.enc-name b { font-family: var(--display); font-weight: 400; font-size: 26px; color: #fff; }
.enc-name i { font-style: normal; padding: 2px 8px; background: var(--paper); color: var(--ink); font-size: 16px; font-weight: 900; }
.enc-nets { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--ink); border: 3px solid var(--paper); color: #fff; font-weight: 900; font-size: 19px; }
.net { width: 26px; height: 26px; } .net.used { opacity: .22; }
.enc-tip { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); margin: 0; padding: 10px 20px; background: rgba(17,17,20,.9); border: 3px solid var(--paper); color: #fff; font-size: 21px; font-weight: 700; white-space: nowrap; }
.enc-bug { position: absolute; left: calc(50% - 240px); top: 150px; width: 480px; height: 300px; transform-origin: 50% 60%; transition: transform .25s ease-out, opacity .25s; }
.enc-bug .wob { width: 480px; height: 300px; animation: wob 1.6s ease-in-out infinite; }
@keyframes wob { 50% { transform: translateY(-6px) rotate(-1.5deg) } }
.enc-bug.caught { transform: scale(.05) translateY(220px) !important; opacity: 0; transition: transform .6s ease-in, opacity .6s; }
.enc-bug.flee { transform: translate(900px, -240px) rotate(25deg) !important; opacity: 0; transition: transform .7s ease-in, opacity .7s; }
.enc-bug.alert .wob { animation: shake .25s linear infinite; }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.enc-msg { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: var(--display); font-size: 64px; color: #fff; text-shadow: 5px 5px 0 var(--ink); pointer-events: none; opacity: 0; }
.enc-msg.sub { font-family: var(--body); font-weight: 900; font-size: 26px; top: 330px; }
.enc-msg.show { animation: msgpop 1.1s ease-out forwards; }
@keyframes msgpop { 0% { transform: scale(.4); opacity: 0 } 18% { transform: scale(1.12); opacity: 1 } 32% { transform: scale(1) } 85% { opacity: 1 } 100% { opacity: 0 } }
.enc-run { position: absolute; left: 24px; bottom: 24px; height: 50px; padding: 0 20px; background: var(--ink); color: #fff; border: 3px solid var(--paper); font-size: 19px; font-weight: 900; }
.enc-game { position: absolute; inset: 0; pointer-events: none; }
.enc-game button { pointer-events: auto; }
.g-btn { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); min-width: 320px; height: 78px; padding: 0 30px; border: 5px solid var(--ink); background: var(--gold); color: var(--ink); font-family: var(--display); font-size: 30px; box-shadow: 6px 6px 0 var(--ink); touch-action: none; }
.g-btn.down { transform: translateX(-50%) translateY(4px); box-shadow: 2px 2px 0 var(--ink); background: #FFE680; }
.ring-svg { position: absolute; inset: 0; }
.g-track { position: absolute; left: calc(50% - 320px); top: 530px; width: 640px; height: 34px; background: #2A2A32; border: 4px solid var(--paper); }
.g-zone { position: absolute; top: 0; bottom: 0; background: #4CAF50; }
.g-mark { position: absolute; top: -12px; width: 10px; height: 50px; margin-left: -5px; background: #fff; border: 3px solid var(--ink); }
.g-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--lime); }
.g-label { position: absolute; left: calc(50% - 320px); top: 496px; width: 640px; display: flex; justify-content: space-between; font-size: 19px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
.g-state { position: absolute; left: 50%; top: 446px; transform: translateX(-50%); padding: 6px 18px; border: 3px solid var(--ink); font-size: 21px; font-weight: 900; color: var(--ink); white-space: nowrap; }

/* 규칙 카드 */
.rules { width: 780px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 #2E7D4F; padding: 26px 34px; display: flex; flex-direction: column; gap: 14px; }
.rules-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-variant-numeric: tabular-nums; }
.rules-head span { padding: 4px 12px; background: #2E7D4F; color: #fff; font-size: 17px; }
.rules h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; }

@keyframes lungeR { 40% { transform: translateX(70px) } } @keyframes lungeL { 40% { transform: translateX(-70px) } }

@keyframes enterIn { from { transform: translateY(-120px) scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
.b-unit.ko .b-img { opacity: .25; filter: grayscale(1); transform: rotate(180deg) translateY(-40px); animation: none; transition: transform .6s, opacity .6s; }

.plate { position: absolute; width: 250px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }

.float { position: absolute; transform: translateX(-50%); font-family: var(--display); font-size: 40px; color: var(--gold); text-shadow: 3px 3px 0 var(--ink), -2px -2px 0 var(--ink); pointer-events: none; animation: rise .9s ease-out forwards; z-index: 6; white-space: nowrap; }

@keyframes rise { 0% { transform: translate(-50%, 10px) scale(.6); opacity: 0 } 20% { transform: translate(-50%, 0) scale(1.1); opacity: 1 } 100% { transform: translate(-50%, -60px); opacity: 0 } }
.banner { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); padding: 8px 22px; background: var(--paper); color: var(--ink); border: 4px solid var(--ink); font-family: var(--display); font-size: 26px; white-space: nowrap; z-index: 6; animation: msgpop 1.4s ease-out forwards; }

/* 배틀 모션: 관절 포즈, 걷기, 날갯짓, 화면 흔들림, 타격 효과 */
.b-world { position: absolute; inset: 0; }
.b-world.q1 { animation: q1 .28s linear; } .b-world.q2 { animation: q2 .5s linear; }
@keyframes q1 { 20% { transform: translate(-8px, 4px) } 40% { transform: translate(7px, -5px) } 60% { transform: translate(-5px, 3px) } 80% { transform: translate(3px, -2px) } }
@keyframes q2 { 10% { transform: translate(-16px, 10px) } 25% { transform: translate(14px, -12px) } 40% { transform: translate(-12px, 8px) } 55% { transform: translate(10px, -6px) } 70% { transform: translate(-6px, 4px) } 85% { transform: translate(3px, -2px) } }
.b-unit { left: 0; top: 0; will-change: transform; }
.b-move { transform-origin: 240px 250px; will-change: transform; }
.b-img .hd, .b-img .arm, .b-img .jawU, .b-img .jawL, .b-img .tail { transition: transform .1s ease-out; }
.b-img .lg, .b-img .lg2 { transform-box: fill-box; transform-origin: 50% 0; }
.b-img.walking .lg { animation: legs .2s linear infinite alternate; }
.b-img.walking .lg2 { animation: legs .2s linear infinite alternate-reverse; }
@keyframes legs { from { transform: rotate(-6deg) translateX(-4px) } to { transform: rotate(6deg) translateX(4px) } }
.b-img .wing { animation: buzz .07s linear infinite alternate; }
@keyframes buzz { from { transform: scaleY(1) } to { transform: scaleY(.5) rotate(-8deg) } }
.b-img:not(.pose-lift):not(.pose-strike):not(.pose-raise) .hd { animation: nod 1.8s ease-in-out infinite; }
@keyframes nod { 50% { transform: rotate(-5deg) } }
.pose-lift .hd { transform: rotate(-30deg); }
.pose-strike .hd { transform: rotate(12deg); }
.pose-raise .arm { transform: rotate(-58deg); }
.pose-strike .arm { transform: rotate(42deg); }
.pose-lift .arm { transform: rotate(-30deg); }
.pose-open .jawU, .pose-lift .jawU { transform: rotate(-18deg); } .pose-open .jawL, .pose-lift .jawL { transform: rotate(18deg); }
.pose-bite .jawU { transform: rotate(8deg); } .pose-bite .jawL { transform: rotate(-8deg); }
.pose-sting .tail { transform: rotate(34deg); }
.pose-brace { filter: drop-shadow(0 0 16px #4FD1FF); }
.fx { position: absolute; pointer-events: none; z-index: 6; }
.fx-burst { width: 160px; height: 160px; margin: -80px 0 0 -80px; animation: burst .38s ease-out forwards; }
.fx-burst.big { width: 260px; height: 260px; margin: -130px 0 0 -130px; }
@keyframes burst { 0% { transform: scale(.2) rotate(0); opacity: 1 } 60% { opacity: 1 } 100% { transform: scale(1.15) rotate(25deg); opacity: 0 } }
.fx-slash { width: 260px; height: 220px; margin: -110px 0 0 -130px; }
.fx-slash path { stroke-dasharray: 320; stroke-dashoffset: 320; animation: slash .32s ease-out forwards; }
@keyframes slash { 60% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }
.fx-dust { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: #C9AE84; animation: dust .6s ease-out forwards; }
@keyframes dust { from { transform: translate(0, 0) scale(.4); opacity: .9 } to { transform: translate(var(--dx), -26px) scale(1.6); opacity: 0 } }
.fx-ring { width: 220px; height: 220px; margin: -110px 0 0 -110px; border-radius: 50%; border: 6px solid #4FD1FF; animation: ring .6s ease-out forwards; }
@keyframes ring { from { transform: scale(.3); opacity: 1 } to { transform: scale(1.2); opacity: 0 } }
.fx-flash { position: absolute; inset: 0; background: #fff; pointer-events: none; z-index: 7; animation: flash .35s ease-out forwards; }
@keyframes flash { from { opacity: .7 } to { opacity: 0 } }

function fit() {
  const w = app.clientWidth, h = app.clientHeight;
  const rot = IS_PHONE && h > w * 1.05;

  const SW = Math.round(Math.max(1280, Math.min(1600, 720 * W / Math.max(1, H))));

  const s = Math.min(W / SW, H / 720);
  const k = SW / 1280, wy = (720 - 720 * k) / 2;

    : `translate(${view.ox}px, ${view.oy}px) scale(${s})`;

/* ---------- 상태 ---------- */
const freshProgress = () => ({ caught: [], lastWin: false, bugs: [], party: [], money: 0, items: {}, day: 1, tut: null, tutDone: false, gifted: false, dex: {}, cages: [], jars: [], eggs: [], deco: {}, goal: null, hubCmd: null, teamName: '' });
let S = { ip: 0, queue: [], mode: 'title', scene: null, onAdvance: null, paused: false, talking: false, modal: false, fieldIp: 0, tw: null, ...freshProgress() };
const actors = {};

function save() {
  const ip = S.mode === 'field' && !(F && F.free) ? S.fieldIp : S.saveIp;
  store.set(SAVE_KEY, { ip, caught: S.caught, lastWin: !!S.lastWin, bugs: S.bugs, party: S.party, money: S.money | 0, items: S.items, day: S.day, tut: S.tut, tutDone: !!S.tutDone, gifted: !!S.gifted, dex: S.dex, cages: S.cages, jars: S.jars, eggs: S.eggs, deco: S.deco, goal: S.goal || null, teamName: S.teamName || '' });
}

/* ---------- 배우 ---------- */
function addActor(id, d) {
  const el = document.createElement('div');
  el.className = 'actor';
  const look = lookOf(id, d.casual);
  el.innerHTML = `<div class="flip"><div class="inner">${chibi(look, d.face || 'smile')}</div></div>`;
  L.actors.appendChild(el);
  actors[id] = { el, face: d.face || 'smile', look };
  placeActor(id, d.x, d.y, d.s);
  if (d.hidden) el.hidden = true;
}
function placeActor(id, x, y, s) {
  const el = actors[id].el;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `scale(${s})`;
}
function setFace(id, face) {
  const a = actors[id]; if (!a || !face || a.face === face) return;
  a.face = face; a.el.querySelector('.inner').innerHTML = chibi(a.look || CH[id].look, face);
}
function bounce(id, cls) {
  const a = actors[id]; if (!a) return;
  a.el.classList.remove(cls); void a.el.offsetWidth; a.el.classList.add(cls);
}

function setScene(id) {
  S.scene = id;
  if (MUSIC[id]) AU.play(MUSIC[id]);
  stage.classList.toggle('field', !!SCENES[id].field);
  L.bg.innerHTML = BG[id]();
  L.front.innerHTML = FRONT[id] || '';
  L.bugs.innerHTML = '';
  L.actors.innerHTML = '';
  for (const k in actors) delete actors[k];
  const sc = SCENES[id];
  for (const [who, d] of Object.entries(sc.actors)) addActor(who, d);
  L.hud.innerHTML = sc.place ? `<div class="place-chip"><small>${sc.place[0]}</small><b>${sc.place[1]}</b></div>` : '';
}

/* ---------- 대사 ---------- */
const dlg = $('#dlg'), tag = $('#tag'), txt = $('#dlgText'), more = $('#more');
function showLine(c, done) {
  dlg.hidden = false;
  const ch = c.t === 'say' ? CH[c.who] : null;
  dlg.classList.toggle('narr', !ch);
  tag.hidden = !ch;
  dlg.classList.toggle('has-face', !!ch);
  if (ch) {
    tag.textContent = ch.name; tag.style.background = ch.color; tag.style.color = ch.fg;
    const lk = (actors[c.who] && actors[c.who].look) || ch.look, fk = c.who + ':' + c.face + (lk.cas ? ':c' : ''), fe = $('#dlgFace');
    if (fe.dataset.k !== fk) { fe.innerHTML = chibi(lk, c.face); fe.dataset.k = fk; }
    fe.style.borderColor = ch.color;
  }
  for (const [id, a] of Object.entries(actors)) a.el.classList.toggle('dim', !!ch && id !== c.who);
  if (ch && actors[c.who]) { setFace(c.who, c.face); bounce(c.who, 'talk'); }
  S.pitch = ch ? PITCH[c.who] : 0;
  typewrite(c.text.replace(/\{팀\}/g, teamNm()), done);
}
function typewrite(text, done) {
  clearInterval(S.tw);
  let i = 0; txt.textContent = ''; more.hidden = true;
  const finish = () => {
    clearInterval(S.tw); txt.textContent = text; more.hidden = false;
    S.onAdvance = () => { S.onAdvance = null; done(); };
  };
  S.onAdvance = finish;
  S.tw = setInterval(() => {
    i += 1; txt.textContent = text.slice(0, i);
    if (i % 2 === 0 && /\S/.test(text[i - 1] || '')) AU.blip(S.pitch);
    if (i >= text.length) finish();
  }, SPEED[prefs.speed]);
}
function hideDlg() {
  dlg.hidden = true;
  for (const a of Object.values(actors)) a.el.classList.remove('dim');
}
function play(lines, done) {
  S.talking = true;
  let i = 0;
  const next = () => {
    if (i >= lines.length) { hideDlg(); S.talking = false; done && done(); return; }
    showLine(lines[i++], next);
  };
  next();
}

/* ---------- 진행 ---------- */
function run() {
  for (;;) {
    let c, fromQueue = false;
    if (S.queue.length) { c = S.queue.shift(); fromQueue = true; }
    else { S.saveIp = S.ip; c = SCRIPT[S.ip++]; }
    if (!c) return;
    if (!fromQueue) save();
    switch (c.t) {
      case 'scene': setScene(c.id); continue;
      case 'hide': { const a = actors[c.who]; if (a) a.el.hidden = true; continue; }
      case 'show': { const a = actors[c.who]; if (a) { a.el.hidden = false; bounce(c.who, 'pop'); } continue; }
      case 'pos': { const p = SCENES[S.scene].pos[c.who][c.pos]; placeActor(c.who, p.x, p.y, p.s); continue; }
      case 'say': case 'narr': return showLine(c, run);
      case 'chapter': hideDlg(); return showChapter(c, run);
      case 'choice': return showChoice(c);
      case 'field': hideDlg(); S.fieldIp = S.ip - 1; return startField();
      case 'rules': hideDlg(); return showRules(run);
      case 'battle': hideDlg(); return startBattle(run);
      case 'result': S.queue.push(...(S.lastWin ? c.win : c.lose)); continue;
      case 'guide': hideDlg(); return showCards('김새롬의 육성 강의', GUIDE, run, '알겠어요!');
      case 'gift':
        if (!S.gifted) { S.gifted = true; S.money = (S.money || 0) + 1500; S.items.sap = (S.items.sap || 0) + 2; AU.sfx('coin'); }
        continue;
      case 'hub': hideDlg(); return openHub(c.tut, c);
      case 'leaguerules': hideDlg(); return showCards('김새롬의 리그 설명', LEAGUE_RULES, run, '특훈 시작!');
      case 'match': hideDlg(); return startMatch(c.key, run);
      case 'trophy': return showTrophy(run, c);
      case 'teamname': hideDlg(); return showTeamName(run);
      case 'wild': hideDlg(); return startWild(c, run);
      case 'daypass': hideDlg(); return showDayPass(run);
      case 'end': hideDlg(); return showEnd();
    }
  }
}
/* 광폭화 곤충과의 배틀: 지면 다시 막아요 */
function startWild(c, done) {
  const party = partyInsects();
  party.forEach((b) => { b.en = Math.max(b.en || 0, Math.round(calcStats(b).en * .8)); });
  const avg = Math.round(party.reduce((a, x) => a + x.lv, 0) / Math.max(1, party.length)) || 3;
  const o = { rand: true, berserk: true, name: c.name, sub: c.sub, team: c.team, lv: avg + (c.lvAdd || 3), look: CH.mx.look, line: c.line, prize: c.prize || 0, q: .9 };
  startBattle(() => {
    if (S.lastWin) { done(); return; }
    S.mode = 'story'; S.modal = true;
    L.ov.innerHTML = `<div class="ov tn"><div class="panel tn-box"><h2>곤충들이 밀렸어요!</h2><p class="tn-p">광폭해진 곤충들이 아직 날뛰고 있어요. 곤충들을 추스르고 다시 막아 주세요!</p><button type="button" class="wide primary" id="wRe">다시 막으러 가기</button></div></div>`;
    $('#wRe').addEventListener('click', () => { L.ov.innerHTML = ''; S.modal = false; startWild(c, done); });
  }, o);
}

  const sug = ['세온 인섹터즈', '세온 비틀즈', '세온 스태그', '최강 곤충단'];
  L.ov.innerHTML = `<div class="ov tn"><div class="panel tn-box" role="dialog" aria-label="팀 이름 정하기"><h2>우리 팀 이름을 정해 주세요</h2>
<p class="tn-p">전국 리그에 나갈 팀 이름이에요. 경기장 전광판과 대진표에 이 이름이 나와요.</p>
<input id="tnIn" maxlength="10" value="${S.teamName || '세온 인섹터즈'}" autocomplete="off" spellcheck="false">
<div class="tn-sug">${sug.map((x) => `<button type="button" class="btn" data-sug="${x}">${x}</button>`).join('')}</div>

function showChapter(c, done) {

  AU.play('encounter'); AU.sfx('alert');
  E = { sp, nets: 3, active: false, g: null, raf: 0, sex: Math.random() < .55 ? 'm' : 'f' };
  markSeen(sp.id);
  L.ov.innerHTML = `<div class="ov enc"><div class="enc-bg">${bgSvg(sp.area)}</div><div class="enc-vig"></div>
<div class="enc-top"><span class="enc-name"><b>${sp.name} ${E.sex === 'f' ? '♀' : '♂'}</b><i>${sp.type} 계통 · ${SP[sp.id].hab}</i></span><span class="enc-nets" id="encNets"></span></div>
<p class="enc-tip" id="encTip">조심조심 다가가는 중이에요…</p>
<div class="enc-bug" id="encBug"><div class="wob">${bugSvg(viewOf(sp.id), 'width="480" height="300"', E.sex)}</div></div>
<div class="enc-game" id="encGame"></div>
<div class="enc-msg" id="encMsg"></div>
<button type="button" class="enc-run" id="encRun">물러나기</button></div>`;
  drawNets();
  $('#encRun').addEventListener('click', (e) => { e.stopPropagation(); endEncounter(false); });
  encMsg(`앗, ${sp.subj} 있어요!`, true);
  setTimeout(() => { if (E) beginGame(); }, 1100);
}
function drawNets() {
  const el = $('#encNets'); if (!el || !E) return;
  el.innerHTML = '채집망 ' + [0, 1, 2].map((i) => NET.replace('class="net"', `class="net${i < 3 - E.nets ? ' used' : ''}"`)).join('');
}
function encMsg(text, sub) {
  const m = $('#encMsg'); if (!m) return;
  m.className = 'enc-msg' + (sub ? ' sub' : ''); m.textContent = text; void m.offsetWidth; m.classList.add('show');
}
function press(sel, fn) {
  const b = $(sel); if (!b) return;
  b.setAttribute('data-quiet', '');
  b.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); AU.init(); fn(); });
}
function beginGame() {
  const g = GAMES[E.sp.game](E.nets, E.sp);
  E.g = g; E.active = true;
  const bug = $('#encBug'); bug.classList.remove('alert'); bug.style.transform = '';
  $('#encTip').textContent = g.tip;
  $('#encGame').innerHTML = g.html;
  g.bind();
  let last = performance.now();
  const step = (t) => {
    if (!E || E.g !== g) return;
    const dt = Math.min(.05, (t - last) / 1000); last = t;
    if (E.active && !S.paused) g.update(dt);
    E.raf = requestAnimationFrame(step);
  };
  E.raf = requestAnimationFrame(step);
}
function gameWin(perfect) {
  if (!E || !E.active) return;
  E.active = false;
  AU.sfx(perfect ? 'perfect' : 'good');
  encMsg(perfect ? '완벽해요!' : '좋아요!');
  setTimeout(() => {
    if (!E) return;
    AU.sfx('throw'); $('#encBug').classList.add('caught');
    setTimeout(() => endEncounter(true), 750);
  }, 650);
}
function gameMiss(text) {
  if (!E || !E.active) return;
  E.active = false; E.nets -= 1; drawNets(); AU.sfx('fail');
  const flee = E.nets <= 0 || Math.random() < 0.15 * (3 - E.nets);
  encMsg(text || '아깝네요!', true);
  setTimeout(() => {
    if (!E) return;
    if (flee) {
      AU.sfx('escape'); $('#encBug').classList.add('flee');
      encMsg(`${E.sp.subj} 도망쳤어요… 잠시 뒤에 다시 나타날 거예요.`, true);
      E.sp.cool = performance.now() + 9000;
      setTimeout(() => endEncounter(false), 1900);
    } else {
      encMsg(`다시 해 봐요! 남은 채집망 ${E.nets}개`, true);
      setTimeout(() => { if (E) beginGame(); }, 1200);
    }
  }, 1000);
}
function endEncounter(caught) {
  if (!E) return;
  const sp = E.sp, sex = E.sex; cancelAnimationFrame(E.raf); E = null;
  L.ov.innerHTML = '';
  AU.play('forest');
  let nb = null;
  if (caught) {
    ensureCages();
    const before = (S.dex && S.dex[sp.id] && S.dex[sp.id].caught) || 0;
    const rare = !!RARE[sp.id] && Math.random() < Math.min(.35, .03 + before * .05);
    nb = newInsect(sp.id, F.free ? 1 + Math.floor(Math.random() * 3) : 3, { sex, rare });
    addBug(nb); E_first = markCaught(sp.id, nb);
    if (F.free) F.got.push(sp.id); else S.caught.push(sp.id);
    save();
  }
  renderBugs(); renderFieldHud(); placeField();
  if (caught) showCatchCard(sp, nb, !F.free); else S.modal = false;
}
const GAMES = {
  ring(nets, sp) {
    const T = 1.7 - (3 - nets) * 0.25; let t = 0, r = 230;
    return {
      tip: '하얀 원이 금색 고리에 딱 겹칠 때 채집망을 던지세요!',
      html: `<svg class="ring-svg" viewBox="0 0 1280 720" aria-hidden="true"><circle cx="640" cy="300" r="74" fill="none" stroke="#FFD23F" stroke-width="10"/><circle id="gRing" cx="640" cy="300" r="230" fill="none" stroke="#fff" stroke-width="6"/></svg><button type="button" class="g-btn" id="gBtn">채집망 던지기</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        t = (t + dt) % T; r = 230 - (t / T) * 200;
        const el = $('#gRing'); if (!el) return;
        const d = Math.abs(r - 74);
        el.setAttribute('r', r.toFixed(1)); el.setAttribute('stroke', d < 10 ? '#7CFC6A' : d < 24 ? '#B8F24A' : '#FFFFFF');
      },
      press(down) { if (!down) return; AU.sfx('throw'); const d = Math.abs(r - 74); if (d < 10) gameWin(true); else if (d < 24) gameWin(false); else gameMiss('빗나갔어요!'); },
      tap() { this.press(true); }
    };
  },
  sneak(nets, sp) {
    let p = 0, hold = false, state = 'calm', st = 1.4 + Math.random(), rust = 0;
    const speed = 26 + (3 - nets) * 4;
    const MAP = { calm: ['#7CFC6A', '먹이에 집중하고 있어요. 지금이에요!'], warn: ['#FFD23F', '더듬이가 움직여요!'], look: ['#FF6B5A', '이쪽을 보고 있어요! 손을 떼세요!'] };
    const set = (s, dur) => {
      state = s; st = dur;
      const el = $('#gState'); if (el) { el.style.background = MAP[s][0]; el.textContent = MAP[s][1]; }
      $('#encBug').classList.toggle('alert', s === 'look');
      if (s === 'warn') AU.sfx('rustle'); if (s === 'look') AU.sfx('buzz');
    };
    return {
      tip: '버튼을 꾹 누르고 있으면 살금살금 다가가요. 곤충이 이쪽을 보면 손을 떼세요!',
      html: `<span class="g-state" id="gState"></span><div class="g-label"><span>거리</span><span id="gPct">0%</span></div><div class="g-track"><div class="g-fill" id="gFill"></div></div><button type="button" class="g-btn" id="gBtn">꾹 눌러서 다가가기</button>`,
      bind() {
        set('calm', st);
        $('#encBug').style.transform = 'scale(.75)';
        const b = $('#gBtn'); b.setAttribute('data-quiet', '');
        b.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); AU.init(); this.press(true); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => this.press(false)));
      },
      update(dt) {
        st -= dt;
        if (st <= 0) {
          if (state === 'calm') set('warn', .6);
          else if (state === 'warn') set('look', 1 + Math.random() * .6);
          else set('calm', Math.max(.6, 1 + Math.random() * 1.4 - (3 - nets) * .2));
        }
        if (hold) {
          if (state === 'look') { this.press(false); gameMiss(`들켰어요! ${sp.subj} 달아나려고 해요.`); return; }
          p = Math.min(100, p + speed * dt);
          rust -= dt; if (rust <= 0) { rust = .3; AU.sfx('step'); }
          $('#encBug').style.transform = `scale(${0.75 + p / 100 * 0.45})`;
          if (p >= 100) { this.press(false); gameWin(state === 'calm'); return; }
        }
        $('#gFill').style.width = p + '%'; $('#gPct').textContent = Math.round(p) + '%';
      },
      press(down) { hold = down; const b = $('#gBtn'); if (b) b.classList.toggle('down', down); }
    };
  },
  bar(nets, sp) {
    const w = 110 - (3 - nets) * 22, z0 = 60 + Math.random() * (640 - w - 120);
    let x = 0, v = 520 + (3 - nets) * 120;
    return {
      tip: '움직이는 표시가 초록 칸(곤충이 숨은 곳)에 들어왔을 때 멈추세요!',
      html: `<div class="g-track"><div class="g-zone" style="left:${z0}px;width:${w}px"></div><div class="g-mark" id="gMark"></div></div><button type="button" class="g-btn" id="gBtn">지금 멈추기!</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        x += v * dt; if (x > 640) { x = 640; v = -v; } if (x < 0) { x = 0; v = -v; }
        const m = $('#gMark'); if (m) m.style.left = x + 'px';
      },
      press(down) { if (!down) return; AU.sfx('throw'); const c = z0 + w / 2; if (x >= z0 && x <= z0 + w) gameWin(Math.abs(x - c) < w * .18); else gameMiss(`${sp.subj} 눈치챘어요!`); },
      tap() { this.press(true); }
    };
  },
  mash(nets, sp) {
    let p = 0, time = 5 - (3 - nets) * .5;
    return {
      tip: sp.mash ? sp.mash[1] : '시간 안에 버튼을 빠르게 연타해서 고목 껍질을 벌리세요!',
      html: `<div class="g-label"><span>${sp.mash ? sp.mash[0] : '껍질 벌리기'}</span><span id="gTime"></span></div><div class="g-track"><div class="g-fill" id="gFill"></div></div><button type="button" class="g-btn" id="gBtn">연타!</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        time -= dt; p = Math.max(0, p - 18 * dt);
        $('#gFill').style.width = p + '%'; $('#gTime').textContent = `남은 시간 ${Math.max(0, time).toFixed(1)}초`;
        if (time <= 0) gameMiss('시간이 다 됐어요!');
      },
      press(down) {
        if (!down) return; AU.sfx('tap'); p = Math.min(100, p + 8.5);
        $('#encBug').style.transform = `translateX(${(Math.random() - .5) * 12}px)`;
        if (p >= 100) gameWin(time > 2);
      },
      tap() { this.press(true); }
    };
  }
};

function bindJoy() {

  const set = (dx, dy) => {
    const d = Math.hypot(dx, dy), k = d > JOY.r ? JOY.r / d : 1;

    $('#joyK').style.transform = `translate(${dx}px, ${dy}px)`;

  };
  const move = (e) => { const p = toStage(e); set(p.x - JOY.cx, p.y - JOY.cy); };
  j.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); AU.init(); pid = e.pointerId; try { j.setPointerCapture(pid); } catch (_) {} move(e); });
  j.addEventListener('pointermove', (e) => { if (e.pointerId === pid) move(e); });
  const end = (e) => { if (e.pointerId !== pid) return; pid = null; set(0, 0); };

  stage.appendChild(el); setTimeout(() => el.remove(), 2000);

  if (cmd) { S.hubCmd = cmd; if (cmd.goal && !S.goal) S.goal = { name: cmd.goal.name, day: (S.day || 1) + cmd.goal.days }; }
  ensureBugs(); ensureDex();

function goPlace(id) {

  else if (id === 'home') openHome();
}

function bindOnOff(root) {
  ['bgm', 'sfx'].forEach((key) => root.querySelectorAll(`[data-${key}]`).forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation(); AU.init();
    prefs[key] = b.dataset[key] === '1'; store.set(PREF_KEY, prefs);
    root.querySelectorAll(`[data-${key}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    if (key === 'bgm') AU.setBgm(prefs.bgm); else AU.setSfx(prefs.sfx);
  })));
}

    e.stopPropagation(); prefs.speed = b.dataset.speed; store.set(PREF_KEY, prefs);
    root.querySelectorAll('[data-speed]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  }));
}
function openMenu() {
  S.paused = true;
  const wrap = document.createElement('div');
  wrap.className = 'ov dim-ov';
  wrap.innerHTML = `<div class="panel" role="dialog" aria-label="메뉴"><h2>메뉴</h2>
<div class="row"><span>텍스트 속도</span>${speedSeg()}</div>
${onoffRow('bgm', '배경음악')}${onoffRow('sfx', '효과음')}
<button type="button" class="wide" id="chartBtn">계통 상성표 보기</button>
<button type="button" class="wide primary" id="resumeBtn">계속하기</button>
<button type="button" class="wide" id="quitBtn">타이틀로 (자동 저장돼요)</button></div>`;
  L.ov.appendChild(wrap);
  AU.sfx('open');
  bindSpeed(wrap); bindOnOff(wrap);
  wrap.addEventListener('pointerdown', (e) => e.stopPropagation());
  $('#chartBtn').addEventListener('click', () => { wrap.remove(); S.paused = false; showTypeChart(); });
  $('#resumeBtn').addEventListener('click', () => { wrap.remove(); S.paused = false; });
  $('#quitBtn').addEventListener('click', () => { wrap.remove(); S.paused = false; showTitle(); });
  $('#resumeBtn').focus({ preventScroll: true });
}
$('#menuBtn').addEventListener('click', (e) => { e.stopPropagation(); openMenu(); });
$('#menuBtn').addEventListener('pointerdown', (e) => e.stopPropagation());

/* ---------- 로딩·타이틀 ---------- */
const TIPS = [
  '팁: 장수풍뎅이는 해가 지면 참나무 수액을 찾아와요.',
  '팁: 곤충 배틀은 3대3 턴제예요. 상성이 불리하면 교체하는 것도 좋은 선택이에요.',
  '팁: 같은 종이라도 어떻게 기르고 브리딩하느냐에 따라 전혀 다른 곤충이 돼요.',
  '팁: 장수말벌은 위험해요. 맨손으로 잡지 말고 꼭 채집망을 쓰세요!',
  '팁: 채집 미니게임에 실패하면 곤충이 도망칠 수 있어요. 채집망은 세 번까지예요.'
];
function showLoading() {
  S.mode = 'loading';
  L.ov.innerHTML = `<div class="ov loading"><span class="ver">v${VERSION}</span><h1>인섹터스 리그</h1>
<div class="track"><div class="fill" id="ldFill"></div><div class="walker" id="ldWalker">${bugSvg('kabuto')}</div></div>
<div class="pct" id="ldPct">0%</div><p class="tip" id="ldTip">${TIPS[0]}</p>
${view.rot ? '<p class="tip" style="color:#B8F24A;font-weight:900">휴대폰을 옆으로 눕혀서 가로로 플레이해 주세요</p>' : ''}</div>`;
  let p = 0, tip = 0, ticks = 0;
  const fill = $('#ldFill'), walker = $('#ldWalker'), pct = $('#ldPct'), tipEl = $('#ldTip');
  const timer = setInterval(() => {
    p = Math.min(100, p + 2 + Math.random() * 3);
    fill.style.width = p + '%'; walker.style.left = p + '%'; pct.textContent = Math.round(p) + '%';
    if (++ticks % 14 === 0) { tip = (tip + 1) % TIPS.length; tipEl.textContent = TIPS[tip]; }
    if (p >= 100) {
      clearInterval(timer);
      pct.outerHTML = '<div class="press">화면을 눌러 주세요</div>';
      S.onAdvance = () => { S.onAdvance = null; goLandscape(); showTitle(); };
    }
  }, 60);
}
function showTitle() {
  S.mode = 'title'; S.onAdvance = null; S.paused = false; S.talking = false; S.modal = false;
  if (E) { cancelAnimationFrame(E.raf); E = null; }
  B = null;
  AU.play('title');
  clearInterval(S.tw); hideDlg(); $('#choices').hidden = true; $('#menuBtn').hidden = true;
  stage.classList.remove('field'); F = null;
  hideHub();
  const sv = store.get(SAVE_KEY);
  L.ov.innerHTML = `<div class="ov title"><span class="ver">v${VERSION}</span><div class="speed"></div><div class="mask"></div><div class="left"></div><div class="tone"></div><div class="rule"></div>
<div class="sprite" style="left:calc(50% + 360px);top:250px;transform:scale(1.7)">${chibi(CH.eh.look, 'happy')}</div>
<div class="sprite" style="left:calc(50% + 80px);top:120px;transform:scale(2.3)">${chibi(CH.kc.look, 'grin')}</div>
<div class="sprite" style="left:calc(50% - 170px);top:470px;transform:scale(.85)">${bugSvg('kabuto', 'width="480" height="300"')}</div>
<div class="text"><span class="chip">곤충 배틀 RPG</span><h1>인섹터스<br>리그</h1>
<p>잡고, 기르고, 붙는다.<br>동네 뒷산에서 세계 무대까지.</p>
<div class="menu">${sv ? `<button type="button" class="primary big" id="contBtn">이어하기 <small>${sv.day ? sv.day + '일째' : ''}</small></button>
<button type="button" id="setBtn">설정</button>
<button type="button" class="ghost" id="newBtn">새로 하기</button>` : `<button type="button" class="primary big" id="newBtn">새 게임</button>
<button type="button" id="setBtn">설정</button>`}
</div></div></div>`;
  let armNew = false;
  $('#newBtn').addEventListener('click', () => {
    if (sv && !armNew) { armNew = true; $('#newBtn').textContent = '한 번 더 누르면 저장이 지워지고 처음부터 시작해요'; $('#newBtn').classList.add('armed'); return; }
    newGame();
  });
  const cb = $('#contBtn'); if (cb) cb.addEventListener('click', () => { const s = store.get(SAVE_KEY); if (s) resume(s); });
  $('#setBtn').addEventListener('click', openSettings);
  (cb || $('#newBtn')).focus({ preventScroll: true });
}
function openSettings() {
  const wrap = document.createElement('div');
  wrap.className = 'ov dim-ov';
  wrap.innerHTML = `<div class="panel" role="dialog" aria-label="설정"><h2>설정</h2>
<div class="row"><span>텍스트 속도</span>${speedSeg()}</div>
${onoffRow('bgm', '배경음악')}${onoffRow('sfx', '효과음')}
<button type="button" class="wide warn" id="wipeBtn">저장 데이터 지우기</button>
<button type="button" class="wide primary" id="closeBtn">닫기</button><p style="margin:0;text-align:center;font-size:16px;font-weight:700;color:#6A6A72">인섹터스 리그 · 버전 ${VERSION}</p></div>`;
  L.ov.appendChild(wrap);
  bindSpeed(wrap); bindOnOff(wrap); AU.sfx('open');
  let armed = false;
  $('#wipeBtn').addEventListener('click', () => {
    if (!armed) { armed = true; $('#wipeBtn').textContent = '한 번 더 누르면 지워져요'; return; }
    store.del(SAVE_KEY); $('#wipeBtn').textContent = '지웠어요'; const c = $('#contBtn'); if (c) c.disabled = true;
  });
  $('#closeBtn').addEventListener('click', () => wrap.remove());
}
function startGame() {
  L.ov.innerHTML = ''; $('#menuBtn').hidden = false; hideHub();
  S.mode = 'story'; S.queue = []; S.paused = false; S.talking = false; S.modal = false;
  run();
}
function newGame() {
  store.del(SAVE_KEY);
  S.ip = 0; Object.assign(S, freshProgress());
  SPOTS.forEach((s) => { s.cool = 0; });
  startGame();
}
function resume(sv) {
  S.ip = Math.max(0, Math.min(SCRIPT.length - 1, sv.ip | 0));
  S.caught = Array.isArray(sv.caught) ? sv.caught.filter((id) => SPOTS.some((s) => s.id === id)) : [];
  S.lastWin = !!sv.lastWin;
  S.bugs = Array.isArray(sv.bugs) ? sv.bugs.map(cleanBug).filter(Boolean) : [];
  S.party = Array.isArray(sv.party) ? sv.party.map(String) : [];
  S.money = Math.max(0, sv.money | 0);
  S.items = {}; for (const k of [...Object.keys(ITEMS), ...Object.keys(SUBS).map((x) => 'sub_' + x), ...Object.keys(GEAR).map((x) => 'gear_' + x), 'antimold']) S.items[k] = Math.max(0, (sv.items && sv.items[k]) | 0);
  S.day = Math.max(1, sv.day | 0 || 1);
  S.tut = sv.tut && typeof sv.tut === 'object' ? Object.fromEntries(TODO.map(([k]) => [k, !!sv.tut[k]])) : null;
  S.tutDone = !!sv.tutDone; S.gifted = !!sv.gifted;
  S.dex = {}; if (sv.dex && typeof sv.dex === 'object') for (const id of DEX) { const e = sv.dex[id]; if (e) S.dex[id] = { seen: true, caught: Math.max(0, e.caught | 0), day: Math.max(0, e.day | 0), m: !!e.m, f: !!e.f, mm: +e.mm || 0 }; }
  ensureDex();
  const okS = (x, T) => (T[x] ? x : 's');
  S.cages = Array.isArray(sv.cages) ? sv.cages.map((c) => ({ id: String(c.id || rid()), size: okS(c.size, CAGE), occ: Array.isArray(c.occ) ? c.occ.map(String) : [], sub: SUBS[c.sub] ? c.sub : 'saw', gear: Object.fromEntries(Object.keys(GEAR).filter((k) => c.gear && c.gear[k]).map((k) => [k, true])), age: c.age | 0, mold: !!c.mold })) : [];
  S.jars = Array.isArray(sv.jars) ? sv.jars.map((j) => ({ id: String(j.id || rid()), size: okS(j.size, JAR), egg: j.egg && SP[j.egg.sp] ? { sp: j.egg.sp, q: +j.egg.q || 0, stage: ['egg', 'larva', 'pupa', 'adult'].includes(j.egg.stage) ? j.egg.stage : 'egg', d: j.egg.d | 0 } : null })) : [];
  S.eggs = Array.isArray(sv.eggs) ? sv.eggs.filter((e) => e && SP[e.sp]).map((e) => ({ id: String(e.id || rid()), sp: e.sp, q: +e.q || 0, day: e.day | 0 })) : [];
  S.goal = sv.goal && sv.goal.day ? { name: String(sv.goal.name || '리그'), day: sv.goal.day | 0 } : null;
  S.teamName = typeof sv.teamName === 'string' ? sv.teamName.slice(0, 12) : '';
  S.deco = {}; if (sv.deco) for (const k in DECO) if (sv.deco[k]) S.deco[k] = true;
  if (S.bugs.length) ensureBugs();
  let scene = null; const after = [];
  for (let i = 0; i < S.ip; i++) {
    const c = SCRIPT[i];
    if (c.t === 'scene') { scene = c.id; after.length = 0; }
    else if (c.t === 'show' || c.t === 'pos') after.push(c);
  }
  L.ov.innerHTML = ''; $('#menuBtn').hidden = false; hideHub();
  if (scene && SCRIPT[S.ip].t !== 'field' && SCRIPT[S.ip].t !== 'hub') {
    setScene(scene);
    after.forEach((c) => {
      if (c.t === 'show') actors[c.who].el.hidden = false;
      else { const p = SCENES[scene].pos[c.who][c.pos]; placeActor(c.who, p.x, p.y, p.s); }
    });
  }
  S.mode = 'story'; S.queue = [];
  run();
}

/* ---------- 입력 ---------- */
stage.addEventListener('pointerdown', (e) => {
  AU.init();
  if (e.target.closest('button') || e.target.closest('.joy')) return;
  if (S.paused) return;
  if (E) { if (E.active && E.g && E.g.tap) E.g.tap(); return; }
  if (S.mode === 'battle') return;
  if (S.onAdvance) { S.onAdvance(); return; }
  if (S.mode === 'field' && !S.talking && !S.modal) { fieldDrag = e.pointerId; setFieldTarget(e); }
});
/* 필드: 터치한 곳으로 이동하고, 누른 채로 끌면 손가락을 따라가요 */
let fieldDrag = null;
function setFieldTarget(e) {
  const p = toWorld(toStage(e));
  F.tx = Math.max(40, Math.min(1240, p.x)); F.ty = Math.max(400, Math.min(630, p.y));
}
stage.addEventListener('pointermove', (e) => {
  if (fieldDrag !== e.pointerId) return;
  if (S.mode !== 'field' || S.talking || S.modal || S.paused || E || !F) { fieldDrag = null; return; }
  setFieldTarget(e);
});
const endDrag = (e) => { if (fieldDrag === e.pointerId) fieldDrag = null; };
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.hasAttribute('data-quiet')) AU.sfx('click');
});
window.addEventListener('keyup', (e) => {
  if (E && E.active && E.g && (e.code === 'Space' || e.code === 'Enter')) E.g.press(false);
});
window.addEventListener('keydown', (e) => {
  AU.init();
  keys[e.code] = true;
  if (S.paused) return;
  if (S.mode === 'battle' && B && !B.over) {
    const k = { KeyA: 'a', KeyQ: 'q', KeyW: 'w', KeyE: 'e', KeyR: 'r' }[e.code];
    if (k) { e.preventDefault(); if (!e.repeat) trySkill(k); return; }
    const d = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (d != null) { if (!e.repeat) command({ kind: 'swap', idx: d }); return; }
  }
  if (E) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat && E.active && E.g) E.g.press(true); }
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !S.onAdvance) return;
    if (S.onAdvance) { e.preventDefault(); S.onAdvance(); }
    else if (S.mode === 'field') { e.preventDefault(); tryInteract(); }
  }
  if (e.code.startsWith('Arrow') && S.mode === 'field') e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { keys = {}; });

showLoading();
})();
</script>
