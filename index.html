<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="곤충을 잡고, 기르고, 배틀하는 곤충 육성 배틀 RPG">
<meta name="theme-color" content="#0E1220">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인섹터스 리그">
<meta name="version" content="0.0.1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>인섹터스 리그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 16:9 무대 하나를 화면에 맞춰 축소·확대하는 게임 프레임. 만화 원고지 + 잉크 + 경기장 밤 */
:root {
  --night: #0E1220;
  --paper: #EFE8D8;
  --ink: #111114;
  --red: #C8232C;
  --lime: #B8F24A;
  --sky: #4FD1FF;
  --gold: #FFD23F;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: #F4F7FB; font-family: var(--body);
  overflow: hidden; box-sizing: border-box; padding: 0;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: #000; }
.layer { position: absolute; inset: 0; }
#world { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
.enc-bg svg, .b-arena svg { display: block; width: 100%; height: 100%; }
.b-ask { margin-left: 8px; color: var(--gold); }
#bg { z-index: 1; } #bugs { z-index: 2; } #actors { z-index: 3; } #front { z-index: 4; pointer-events: none; }
#hud { z-index: 20; pointer-events: none; } #hud button { pointer-events: auto; }
button { font-family: var(--body); cursor: pointer; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

.actor { position: absolute; width: 200px; height: 260px; transform-origin: 0 0; transition: left .5s ease, top .5s ease, filter .2s; }
.actor .flip { width: 200px; height: 260px; transform-origin: 50% 50%; }
.actor .inner { width: 200px; height: 260px; transform-origin: 50% 100%; }
.actor.dim { filter: brightness(.68) saturate(.8); }
.actor.talk .inner { animation: hop .35s ease-out; }
.actor.pop .inner { animation: popin .45s ease-out; }
.field .actor { transition: filter .2s; }
.actor.walk .inner { animation: walk .36s ease-in-out infinite; }
@keyframes hop { 0% { transform: translateY(0) } 40% { transform: translateY(-14px) } 100% { transform: translateY(0) } }
@keyframes popin { 0% { transform: scale(.2); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }
@keyframes walk { 0%,100% { transform: translateY(0) rotate(0) } 25% { transform: translateY(-7px) rotate(-3deg) } 75% { transform: translateY(-7px) rotate(3deg) } }

.place-chip { position: absolute; left: 24px; top: 24px; display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; background: var(--ink); border: 3px solid var(--paper); color: #fff; }
.place-chip small { font-size: 12px; font-weight: 700; color: #C9BFA8; letter-spacing: .04em; }
.place-chip b { font-family: var(--display); font-weight: 400; font-size: 22px; }

#menuBtn { position: absolute; right: 24px; top: 24px; z-index: 40; height: 48px; padding: 0 18px; background: var(--ink); color: #fff; border: 3px solid var(--paper); font-size: 16px; font-weight: 900; }

#dlg { position: absolute; left: 180px; right: 180px; bottom: 28px; min-height: 124px; box-sizing: border-box; background: #fff; color: var(--ink); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--ink); padding: 26px 32px 20px; z-index: 30; }
#dlg.narr { background: var(--ink); color: #F4F1EA; border-color: var(--paper); box-shadow: 8px 8px 0 rgba(0,0,0,.45); }
#tag { position: absolute; left: 20px; top: -22px; padding: 4px 16px; font-family: var(--display); font-size: 20px; }
#dlgText { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.55; white-space: pre-line; min-height: 68px; }
#more { position: absolute; right: 22px; bottom: 12px; font-size: 16px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0 } }

#choices { position: absolute; left: 50%; top: 250px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 16px; z-index: 35; }
.choice { min-width: 440px; height: 66px; font-size: 22px; font-weight: 900; color: var(--ink); background: #fff; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--red); }
.choice:hover { background: var(--gold); }

.ov { position: absolute; inset: 0; z-index: 50; }

/* 로딩 */
.loading { background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; }
.loading h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 72px; color: #fff; text-shadow: 6px 6px 0 var(--red); }
.track { position: relative; width: 560px; height: 14px; background: #2A2A32; border: 3px solid var(--paper); }
.track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime); }
.track .walker { position: absolute; top: -52px; width: 96px; height: 60px; margin-left: -60px; }
.track .walker svg { width: 96px; height: 60px; }
.loading .pct { font-family: var(--display); font-size: 22px; color: var(--paper); font-variant-numeric: tabular-nums; }
.loading .tip { max-width: 640px; text-align: center; font-size: 17px; line-height: 1.6; color: #C9C3B4; min-height: 54px; }
.loading .press { font-size: 20px; font-weight: 900; color: var(--gold); animation: blink 1.2s steps(2) infinite; }

/* 타이틀 */
.title { background: var(--paper); color: var(--ink); overflow: hidden; }
.title .speed { position: absolute; inset: 0; background: repeating-conic-gradient(from 0deg at 72% 46%, #16161A 0deg .9deg, rgba(0,0,0,0) .9deg 7deg); }
.title .mask { position: absolute; inset: 0; background: radial-gradient(circle at 72% 46%, var(--paper) 0 24%, rgba(239,232,216,0) 62%); }
.title .left { position: absolute; left: 0; top: 0; width: 50%; height: 720px; background: var(--paper); }
.title .tone { position: absolute; left: 0; bottom: 0; width: 700px; height: 280px; background-image: radial-gradient(#16161A 1.6px, rgba(0,0,0,0) 1.9px); background-size: 10px 10px; opacity: .16; }
.title .rule { position: absolute; left: 50%; top: 0; width: 8px; height: 720px; background: var(--ink); }
.title .text { position: absolute; left: 64px; top: 64px; width: 520px; display: flex; flex-direction: column; gap: 16px; }
.title .chip { align-self: flex-start; padding: 6px 14px; background: var(--red); color: #fff; font-size: 15px; font-weight: 900; letter-spacing: .04em; }
.title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 118px; line-height: .95; text-shadow: 6px 6px 0 var(--red); }
.title p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.5; }
.menu { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; width: 300px; }
.menu button { height: 54px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 700; text-align: left; padding: 0 22px; }
.menu button.primary { background: var(--ink); color: #fff; font-size: 20px; font-weight: 900; box-shadow: 6px 6px 0 var(--red); }
.menu button:disabled { opacity: .4; cursor: default; }
.sprite { position: absolute; transform-origin: 0 0; }

/* 챕터 카드 */
.chapter { background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; animation: fade .6s ease-out; }
.chapter span { padding: 6px 16px; background: var(--red); color: #fff; font-size: 20px; font-weight: 900; }
.chapter h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 84px; color: #fff; text-wrap: balance; }
.chapter i { width: 380px; height: 4px; background: var(--paper); }
.chapter small { font-size: 16px; color: #C9C3B4; animation: blink 1.2s steps(2) infinite; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

/* 메뉴·설정 */
.dim-ov { background: rgba(8,10,18,.72); display: flex; align-items: center; justify-content: center; }
.panel { width: 520px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 var(--red); padding: 28px 32px; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; }
.panel .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 18px; font-weight: 700; }
.seg { display: flex; border: 3px solid var(--ink); }
.seg button { height: 44px; padding: 0 14px; border: 0; background: #fff; color: var(--ink); font-size: 16px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.panel .wide { height: 52px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 900; }
.panel .wide.primary { background: var(--ink); color: #fff; }
.panel .wide.warn { color: var(--red); }

/* 필드 */
.f-count { position: absolute; right: 150px; top: 24px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--ink); border: 3px solid var(--paper); color: #fff; font-weight: 900; font-size: 16px; }
.f-slot { width: 60px; height: 40px; background: #2A2A32; border: 2px solid #5A5A66; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.f-slot svg { width: 58px; height: 36px; }
.f-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 18px; background: rgba(17,17,20,.86); border: 3px solid var(--paper); color: #fff; font-size: 17px; font-weight: 700; white-space: nowrap; }
#actBtn { position: absolute; right: 36px; bottom: 36px; width: 128px; height: 128px; border-radius: 50%; border: 5px solid var(--ink); background: #5A5A66; color: #D8D8DE; font-family: var(--display); font-size: 30px; box-shadow: 6px 6px 0 var(--ink); }
#actBtn.ready { background: var(--gold); color: var(--ink); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.07) } }
.spark { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; animation: twinkle 1.1s ease-in-out infinite; pointer-events: none; }
@keyframes twinkle { 0%,100% { transform: scale(.7) rotate(0); opacity: .6 } 50% { transform: scale(1.15) rotate(20deg); opacity: 1 } }
#bang { position: absolute; width: 40px; height: 48px; margin-left: -20px; font-family: var(--display); font-size: 34px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
.bug { position: absolute; width: 480px; height: 300px; transform-origin: 50% 50%; pointer-events: none; }

.catch { background: rgba(8,10,18,.78); display: flex; align-items: center; justify-content: center; }
.catch-card { position: relative; width: 620px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 var(--gold); padding: 26px 34px 30px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: popin .45s ease-out; }
.catch-bug { width: 480px; height: 300px; margin: -10px 0 -20px; animation: spinin .7s ease-out; }
@keyframes spinin { from { transform: scale(.3) rotate(-25deg); opacity: 0 } to { transform: none; opacity: 1 } }
.catch-card .type { padding: 4px 12px; background: var(--ink); color: #fff; font-size: 14px; font-weight: 900; }
.catch-card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; }
.catch-card .where { margin: 0; font-size: 15px; font-weight: 700; color: #4A4A52; }
.catch-card .fact { margin: 0; font-size: 17px; line-height: 1.6; max-width: 520px; }
.catch-card button { margin-top: 8px; height: 56px; padding: 0 30px; border: 4px solid var(--ink); background: var(--ink); color: #fff; font-size: 19px; font-weight: 900; box-shadow: 5px 5px 0 var(--red); }

.end { background: var(--paper); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.end .chip { padding: 6px 16px; background: var(--red); color: #fff; font-size: 18px; font-weight: 900; }
.end h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 64px; text-shadow: 5px 5px 0 var(--gold); }
.team { display: flex; gap: 20px; }
.team div { width: 250px; background: #fff; border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); padding: 10px 12px 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.team svg { width: 224px; height: 140px; }
.team b { font-size: 20px; } .team small { font-size: 13px; font-weight: 700; color: #4A4A52; }
.end p { margin: 0; font-size: 18px; font-weight: 700; }
.end .btns { display: flex; gap: 14px; }
.end .btns button { height: 54px; padding: 0 26px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 900; }
.end .btns button.primary { background: var(--ink); color: #fff; box-shadow: 5px 5px 0 var(--red); }

/* 채집 조우 */
.enc { background: #0B0F0A; overflow: hidden; }
.enc-bg { position: absolute; inset: -30px; filter: blur(7px) brightness(.55) saturate(.9); }
.enc-vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 100%); }
.enc-top { position: absolute; left: 24px; right: 24px; top: 22px; display: flex; justify-content: space-between; align-items: center; }
.enc-name { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: var(--ink); border: 3px solid var(--paper); }
.enc-name b { font-family: var(--display); font-weight: 400; font-size: 26px; color: #fff; }
.enc-name i { font-style: normal; padding: 2px 8px; background: var(--paper); color: var(--ink); font-size: 13px; font-weight: 900; }
.enc-nets { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--ink); border: 3px solid var(--paper); color: #fff; font-weight: 900; font-size: 16px; }
.net { width: 26px; height: 26px; } .net.used { opacity: .22; }
.enc-tip { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); margin: 0; padding: 10px 20px; background: rgba(17,17,20,.9); border: 3px solid var(--paper); color: #fff; font-size: 18px; font-weight: 700; white-space: nowrap; }
.enc-bug { position: absolute; left: calc(50% - 240px); top: 150px; width: 480px; height: 300px; transform-origin: 50% 60%; transition: transform .25s ease-out, opacity .25s; }
.enc-bug .wob { width: 480px; height: 300px; animation: wob 1.6s ease-in-out infinite; }
@keyframes wob { 50% { transform: translateY(-6px) rotate(-1.5deg) } }
.enc-bug.caught { transform: scale(.05) translateY(220px) !important; opacity: 0; transition: transform .6s ease-in, opacity .6s; }
.enc-bug.flee { transform: translate(900px, -240px) rotate(25deg) !important; opacity: 0; transition: transform .7s ease-in, opacity .7s; }
.enc-bug.alert .wob { animation: shake .25s linear infinite; }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.enc-msg { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: var(--display); font-size: 64px; color: #fff; text-shadow: 5px 5px 0 var(--ink); pointer-events: none; opacity: 0; }
.enc-msg.sub { font-family: var(--body); font-weight: 900; font-size: 26px; top: 330px; }
.enc-msg.show { animation: msgpop 1.1s ease-out forwards; }
@keyframes msgpop { 0% { transform: scale(.4); opacity: 0 } 18% { transform: scale(1.12); opacity: 1 } 32% { transform: scale(1) } 85% { opacity: 1 } 100% { opacity: 0 } }
.enc-run { position: absolute; left: 24px; bottom: 24px; height: 50px; padding: 0 20px; background: var(--ink); color: #fff; border: 3px solid var(--paper); font-size: 16px; font-weight: 900; }
.enc-game { position: absolute; inset: 0; pointer-events: none; }
.enc-game button { pointer-events: auto; }
.g-btn { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); min-width: 320px; height: 78px; padding: 0 30px; border: 5px solid var(--ink); background: var(--gold); color: var(--ink); font-family: var(--display); font-size: 30px; box-shadow: 6px 6px 0 var(--ink); touch-action: none; }
.g-btn.down { transform: translateX(-50%) translateY(4px); box-shadow: 2px 2px 0 var(--ink); background: #FFE680; }
.ring-svg { position: absolute; inset: 0; }
.g-track { position: absolute; left: calc(50% - 320px); top: 530px; width: 640px; height: 34px; background: #2A2A32; border: 4px solid var(--paper); }
.g-zone { position: absolute; top: 0; bottom: 0; background: #4CAF50; }
.g-mark { position: absolute; top: -12px; width: 10px; height: 50px; margin-left: -5px; background: #fff; border: 3px solid var(--ink); }
.g-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--lime); }
.g-label { position: absolute; left: calc(50% - 320px); top: 496px; width: 640px; display: flex; justify-content: space-between; font-size: 16px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
.g-state { position: absolute; left: 50%; top: 446px; transform: translateX(-50%); padding: 6px 18px; border: 3px solid var(--ink); font-size: 18px; font-weight: 900; color: var(--ink); white-space: nowrap; }

/* 규칙 카드 */
.rules { width: 780px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 10px 10px 0 #2E7D4F; padding: 26px 34px; display: flex; flex-direction: column; gap: 14px; }
.rules-head { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-variant-numeric: tabular-nums; }
.rules-head span { padding: 4px 12px; background: #2E7D4F; color: #fff; font-size: 14px; }
.rules h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; }
.rules p { margin: 0; font-size: 20px; line-height: 1.65; font-weight: 500; text-wrap: pretty; }
.rules-art { min-height: 120px; display: flex; align-items: center; justify-content: center; gap: 14px; background: #fff; border: 3px solid var(--ink); padding: 10px; }
.rules-art svg { width: 168px; height: 105px; }
.kbtn { width: 92px; height: 72px; border: 3px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; }
.kbtn b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.tri { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 900; }
.tri span { padding: 6px 14px; color: #fff; }
.rules-nav { display: flex; justify-content: space-between; }
.rules-nav button { height: 52px; padding: 0 26px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 900; }
.rules-nav button.primary { background: var(--ink); color: #fff; box-shadow: 5px 5px 0 #2E7D4F; }
.rules-nav button:disabled { opacity: .35; cursor: default; }

/* 배틀 */
.battle { background: #0A0D16; overflow: hidden; color: #F4F7FB; }
.b-top { position: absolute; left: 0; right: 0; top: 0; height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; background: var(--ink); border-bottom: 4px solid var(--paper); z-index: 5; }
.b-side { display: flex; align-items: center; gap: 12px; width: 420px; }
.b-side.r { justify-content: flex-end; }
.b-face { width: 50px; height: 50px; overflow: hidden; border: 3px solid var(--paper); background: var(--paper); flex: none; }
.b-face svg { width: 100px; height: 130px; margin: -16px 0 0 -25px; }
.b-who b { display: block; font-size: 18px; } .b-who small { font-size: 12px; color: #C9D3E2; }
.pips { display: flex; gap: 6px; } .pip { width: 14px; height: 14px; background: var(--lime); } .pip.r { background: #FF8A2B; } .pip.out { background: #3A4458; }
.b-clock { text-align: center; } .b-clock small { display: block; font-size: 12px; font-weight: 700; color: #C9D3E2; }
.b-clock b { font-family: var(--display); font-weight: 400; font-size: 32px; font-variant-numeric: tabular-nums; }
.b-pause { height: 40px; padding: 0 12px; background: transparent; color: #fff; border: 3px solid var(--paper); font-weight: 900; font-size: 14px; }
.b-arena { position: absolute; inset: 0; }
.b-unit { position: absolute; width: 480px; height: 300px; transform-origin: 0 0; }
.b-move { width: 480px; height: 300px; }
.b-img { width: 480px; height: 300px; transform-origin: 50% 60%; animation: wob 1.4s ease-in-out infinite; }
.b-img.hit { animation: hitfx .3s ease-out; }
@keyframes hitfx { 0% { filter: brightness(3); transform: translateX(-10px) } 50% { transform: translateX(10px) } 100% { filter: none; transform: none } }
.b-move.lungeR { animation: lungeR .3s ease-out; } .b-move.lungeL { animation: lungeL .3s ease-out; }
@keyframes lungeR { 40% { transform: translateX(70px) } } @keyframes lungeL { 40% { transform: translateX(-70px) } }
.b-unit.in .b-move { animation: enterIn .5s ease-out; }
@keyframes enterIn { from { transform: translateY(-120px) scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
.b-unit.ko .b-img { opacity: .25; filter: grayscale(1); transform: rotate(180deg) translateY(-40px); animation: none; transition: transform .6s, opacity .6s; }
.b-unit.stun .b-img { animation: shake .3s linear infinite; }

<script>
const VERSION = '0.0.1';
(() => {
const $ = (s) => document.querySelector(s);
const app = $('#app'), stage = $('#stage');
const L = { bg: $('#bg'), bugs: $('#bugs'), actors: $('#actors'), front: $('#front'), hud: $('#hud'), ov: $('#overlay') };
const view = { scale: 1, ox: 0, oy: 0 };

/* 폰·태블릿에서 화면이 세로면 무대를 90도 돌려서 가로로 플레이하게 한다. PC는 돌리지 않고 그대로 맞춘다 */

  || (!!window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches);

  const w = app.clientWidth, h = app.clientHeight;

  // 무대 높이는 720으로 고정하고, 가로는 화면 비율에 맞춰 1280~1600까지 늘린다 (갤럭시 S23 19.5:9 ≈ 1560)

    ? `translate(${w}px, 0) rotate(90deg) translate(${view.ox}px, ${view.oy}px) scale(${s})`
    : `translate(${view.ox}px, ${view.oy}px) scale(${s})`;

  const r = app.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;

  if (!IS_PHONE) return;

    bass: 'E2 E2 E3 E2 E2 E2 E3 E2 | E2 E2 E3 E2 E2 E2 E3 E2 | C2 C2 C3 C2 C2 C2 C3 C2 | D2 D2 D3 D2 D2 D2 D3 D2',

    bass: 'A2 A2 A3 A2 A2 A2 A3 A2 | F2 F2 F3 F2 F2 F2 F3 F2 | G2 G2 G3 G2 G2 G2 G3 G2 | E2 E2 E3 E2 E2 E2 E3 E2',
    ch: [['A3', 'C4', 'E4'], ['F3', 'A3', 'C4'], ['G3', 'B3', 'D4'], ['E3', 'G#3', 'B3']], dr: { k: 'k.kk.k.k', s: '..s...s.', h: 'hhhhhhhh' } },
  victory: { bpm: 120, lead: 'square', lv: .1, mel: 'C5 E5 G5 C6 - - G5 - | A5 - F5 - C6 - A5 - | B5 - G5 - D6 - B5 - | C6 - - - - - . .',
    bass: 'C3 . G2 . C3 . G2 . | F2 . C3 . F2 . C3 . | G2 . D3 . G2 . D3 . | C3 . G2 . C3 . . .',
    ch: [['C4', 'E4', 'G4'], ['F4', 'A4', 'C5'], ['G4', 'B4', 'D5'], ['C4', 'E4', 'G4']], dr: { k: 'k...k...', s: '..s...s.', h: 'h.h.h.h.' } }
};
for (const s of Object.values(SONGS)) { s.m = toks(s.mel); s.b = toks(s.bass); s.len = s.m.length; }

const AU = {
  ctx: null, want: null, cur: null, timer: 0, step: 0, next: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    try { this.ctx = new C(); } catch (e) { this.ctx = null; return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = .9; this.master.connect(c.destination);
    this.bgm = c.createGain(); this.bgm.gain.value = prefs.bgm ? .5 : 0; this.bgm.connect(this.master);
    this.fx = c.createGain(); this.fx.gain.value = prefs.sfx ? .7 : 0; this.fx.connect(this.master);

  setBgm(on) { if (this.ctx) this.bgm.gain.setTargetAtTime(on ? .5 : 0, this.ctx.currentTime, .05); },
  setSfx(on) { if (this.ctx) this.fx.gain.setTargetAtTime(on ? .7 : 0, this.ctx.currentTime, .05); },
  tone(f, t, dur, o = {}) {

    g.gain.setValueAtTime(v, t + Math.max(a, dur - r)); g.gain.exponentialRampToValueAtTime(.0001, t + dur + r);

    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; osc.connect(fl); node = fl; }

  noise(t, dur, o = {}) {

    if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur);

  stop() { clearInterval(this.timer); this.timer = 0; this.cur = null; this.want = null; },
  tick() {

  stepAt(i, t, sd) {

function crowd() {
  let s = '';
  const cols = ['#1F283A', '#1F283A', '#2A3550', '#FF8A2B', '#1F283A', '#B8F24A'];
  for (let i = 0; i < 90; i++) {
    const x = (i * 137) % 1280, y = 170 + ((i * 53) % 110);
    s += `<circle cx="${x}" cy="${y}" r="9" fill="${cols[i % cols.length]}"/>`;
  }
  return s;
}

/* ---------- 상태 ---------- */
const freshProgress = () => ({ caught: [], lastWin: false, bugs: [], party: [], money: 0, items: {}, day: 1, tut: null, tutDone: false, gifted: false, dex: {} });
let S = { ip: 0, queue: [], mode: 'title', scene: null, onAdvance: null, paused: false, talking: false, modal: false, fieldIp: 0, tw: null, ...freshProgress() };
const actors = {};

function save() {
  const ip = S.mode === 'field' && !(F && F.free) ? S.fieldIp : S.saveIp;
  store.set(SAVE_KEY, { ip, caught: S.caught, lastWin: !!S.lastWin, bugs: S.bugs, party: S.party, money: S.money | 0, items: S.items, day: S.day, tut: S.tut, tutDone: !!S.tutDone, gifted: !!S.gifted, dex: S.dex });
}

/* ---------- 배우 ---------- */
function addActor(id, d) {
  const el = document.createElement('div');
  el.className = 'actor';
  el.innerHTML = `<div class="flip"><div class="inner">${chibi(CH[id].look, d.face || 'smile')}</div></div>`;
  L.actors.appendChild(el);
  actors[id] = { el, face: d.face || 'smile' };
  placeActor(id, d.x, d.y, d.s);
  if (d.hidden) el.hidden = true;
}
function placeActor(id, x, y, s) {
  const el = actors[id].el;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `scale(${s})`;
}
function setFace(id, face) {
  const a = actors[id]; if (!a || !face || a.face === face) return;
  a.face = face; a.el.querySelector('.inner').innerHTML = chibi(CH[id].look, face);
}
function bounce(id, cls) {
  const a = actors[id]; if (!a) return;
  a.el.classList.remove(cls); void a.el.offsetWidth; a.el.classList.add(cls);
}

function setScene(id) {
  S.scene = id;
  if (MUSIC[id]) AU.play(MUSIC[id]);
  stage.classList.toggle('field', !!SCENES[id].field);
  L.bg.innerHTML = BG[id]();
  L.front.innerHTML = FRONT[id] || '';
  L.bugs.innerHTML = '';
  L.actors.innerHTML = '';
  for (const k in actors) delete actors[k];
  const sc = SCENES[id];
  for (const [who, d] of Object.entries(sc.actors)) addActor(who, d);
  L.hud.innerHTML = sc.place ? `<div class="place-chip"><small>${sc.place[0]}</small><b>${sc.place[1]}</b></div>` : '';
}

/* ---------- 대사 ---------- */
const dlg = $('#dlg'), tag = $('#tag'), txt = $('#dlgText'), more = $('#more');
function showLine(c, done) {
  dlg.hidden = false;
  const ch = c.t === 'say' ? CH[c.who] : null;
  dlg.classList.toggle('narr', !ch);
  tag.hidden = !ch;
  dlg.classList.toggle('has-face', !!ch);
  if (ch) {
    tag.textContent = ch.name; tag.style.background = ch.color; tag.style.color = ch.fg;
    const fk = c.who + ':' + c.face, fe = $('#dlgFace');
    if (fe.dataset.k !== fk) { fe.innerHTML = chibi(ch.look, c.face); fe.dataset.k = fk; }
    fe.style.borderColor = ch.color;
  }
  for (const [id, a] of Object.entries(actors)) a.el.classList.toggle('dim', !!ch && id !== c.who);
  if (ch && actors[c.who]) { setFace(c.who, c.face); bounce(c.who, 'talk'); }
  S.pitch = ch ? PITCH[c.who] : 0;
  typewrite(c.text, done);
}
function typewrite(text, done) {
  clearInterval(S.tw);
  let i = 0; txt.textContent = ''; more.hidden = true;
  const finish = () => {
    clearInterval(S.tw); txt.textContent = text; more.hidden = false;
    S.onAdvance = () => { S.onAdvance = null; done(); };
  };
  S.onAdvance = finish;
  S.tw = setInterval(() => {
    i += 1; txt.textContent = text.slice(0, i);
    if (i % 2 === 0 && /\S/.test(text[i - 1] || '')) AU.blip(S.pitch);
    if (i >= text.length) finish();
  }, SPEED[prefs.speed]);
}
function hideDlg() {
  dlg.hidden = true;
  for (const a of Object.values(actors)) a.el.classList.remove('dim');
}
function play(lines, done) {
  S.talking = true;
  let i = 0;
  const next = () => {
    if (i >= lines.length) { hideDlg(); S.talking = false; done && done(); return; }
    showLine(lines[i++], next);
  };
  next();
}

/* ---------- 진행 ---------- */
function run() {
  for (;;) {
    let c, fromQueue = false;
    if (S.queue.length) { c = S.queue.shift(); fromQueue = true; }
    else { S.saveIp = S.ip; c = SCRIPT[S.ip++]; }
    if (!c) return;
    if (!fromQueue) save();
    switch (c.t) {
      case 'scene': setScene(c.id); continue;
      case 'show': { const a = actors[c.who]; if (a) { a.el.hidden = false; bounce(c.who, 'pop'); } continue; }
      case 'pos': { const p = SCENES[S.scene].pos[c.who][c.pos]; placeActor(c.who, p.x, p.y, p.s); continue; }
      case 'say': case 'narr': return showLine(c, run);
      case 'chapter': hideDlg(); return showChapter(c, run);
      case 'choice': return showChoice(c);
      case 'field': hideDlg(); S.fieldIp = S.ip - 1; return startField();
      case 'rules': hideDlg(); return showRules(run);
      case 'battle': hideDlg(); return startBattle(run);
      case 'result': S.queue.push(...(S.lastWin ? c.win : c.lose)); continue;
      case 'guide': hideDlg(); return showCards('김새롬의 육성 강의', GUIDE, run, '알겠어요!');
      case 'gift':
        if (!S.gifted) { S.gifted = true; S.money = (S.money || 0) + 1500; S.items.jelly = (S.items.jelly || 0) + 2; AU.sfx('coin'); }
        continue;
      case 'hub': hideDlg(); return openHub(c.tut);
      case 'end': hideDlg(); return showEnd();
    }
  }
}
function showChapter(c, done) {
  AU.stop(); AU.sfx('chapter');
  L.ov.innerHTML = `<div class="ov chapter"><span>${c.no}</span><h2>${c.title}</h2><i></i><small>화면을 누르면 계속돼요</small></div>`;
  let gone = false, t = 0;
  const go = () => {
    if (gone) return;
    if (S.paused) { t = setTimeout(go, 400); return; }
    gone = true; clearTimeout(t); S.onAdvance = null; L.ov.innerHTML = '';
    if (S.scene && MUSIC[S.scene]) AU.play(MUSIC[S.scene]);
    done();
  };
  t = setTimeout(go, 2600);
  S.onAdvance = go;
}
function showChoice(c) {
  const box = $('#choices');
  more.hidden = true;
  box.innerHTML = '';
  c.options.forEach((o) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'choice'; b.textContent = o.label;
    b.addEventListener('click', (e) => {
      e.stopPropagation(); box.hidden = true; box.innerHTML = '';
      S.queue.push(...o.then); run();
    });
    box.appendChild(b);
  });
  box.hidden = false;
  box.querySelector('button').focus({ preventScroll: true });
}

function feed(b, k, draw) {
  const it = ITEMS[k], name = SP[b.id].name;
  if (!S.items[k]) return;
  if (it.cond && b.cond >= 100) { note('컨디션이 이미 가득 찼어요.', 'fail'); return; }
  if (it.stat && b.bonus[it.stat] >= BONUS_MAX) { note(`${statName(it.stat)}은(는) 더 이상 오르지 않아요.`, 'fail'); return; }
  S.items[k] -= 1;
  let msg = '';
  if (it.cond) { b.cond = Math.min(100, b.cond + it.cond); msg = `${name}의 컨디션이 회복됐어요!`; }
  if (it.stat) { b.bonus[it.stat] = Math.min(BONUS_MAX, b.bonus[it.stat] + 2); msg = `${name}의 ${statName(it.stat)}이(가) 2 올랐어요!`; }
  if (it.xp) msg = gainXp(b, it.xp) ? `레벨 업! ${name} Lv.${b.lv}` : `${name}의 경험치가 ${it.xp} 올랐어요!`;
  if (S.tut) S.tut.feed = true;
  save(); note(msg, msg.startsWith('레벨') ? 'win' : 'heal'); draw();
}
function train(b, k, draw) {
  if (b.cond < TRAIN_COST) return;
  const name = SP[b.id].name;
  b.cond -= TRAIN_COST;
  const capped = b.bonus[k] >= BONUS_MAX;
  if (!capped) b.bonus[k] += 1;
  const up = gainXp(b, 15);
  if (S.tut) S.tut.train = true;
  save();
  note(up ? `레벨 업! ${name} Lv.${b.lv}` : capped ? `${statName(k)}은(는) 한계까지 올랐어요. 경험치 +15` : `특훈 성공! ${statName(k)} +1 · 경험치 +15`, up ? 'win' : 'perfect');
  draw();
}

  family: ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '한', '오', '서', '신', '권', '황', '송', '유'],

  school: ['한빛초 6학년', '푸른중 1학년', '새봄중 2학년', '은하중 3학년', '동산중 2학년', '바다중 1학년', '솔빛중 3학년'],

    ['풀숲 사냥꾼', (s) => s.hab === '육상'], ['연못 탐험가', (s, id) => ['diving', 'waterbug', 'dragonfly', 'mosquito'].includes(id)],
    ['날개 곤충 수집가', (s) => s.hab === '공중'], ['딱정벌레 마니아', (s, id) => ['kabuto', 'stag', 'chafer', 'diving'].includes(id)], ['독침 계통 고수', (s) => s.type === '독침']],
  hair: ['spiky', 'pony', 'cool', 'neat', 'bob'],
  hc: [['#2A2430', '#4E4A66'], ['#7A4A2A', '#A8703E'], ['#1E2440', '#3A4670'], ['#3A2418', '#6A4630'], ['#5A3A6A', '#8A6AA0'], ['#A86A2A', '#D89A50'], ['#2A4A3A', '#4A7A60']],
  ec: ['#6A4226', '#3A4A8A', '#4A2A18', '#2E6A4A', '#7A3A5A'],
  tie: ['#C8232C', '#1F3A6E', '#2E7D4F', '#E07A1F', '#6A3AA0', '#1E9A9A']
};
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function randomBattler() {
  const [title, ok] = pick(RB.title);
  const pool = Object.keys(SP).filter((id) => ok(SP[id], id));
  const team = [];
  while (team.length < 3) { const id = pick(pool); if (!team.includes(id)) team.push(id); }
  const avgLv = Math.round(partyInsects().reduce((a, x) => a + x.lv, 0) / Math.max(1, partyInsects().length)) || 3;
  const lv = Math.max(1, avgLv + Math.floor(Math.random() * 4) - 1);
  const hair = pick(RB.hair), [hc, hl] = pick(RB.hc), tie = pick(RB.tie);
  const look = { hair, outfit: hair === 'pony' || hair === 'bob' ? 'girl' : 'boy', acc: Math.random() < .25 ? 'glasses' : Math.random() < .15 ? 'bandage' : 'none', hc, hl, ec: pick(RB.ec), tie };
  return { rand: true, name: pick(RB.family) + pick(RB.given), sub: `${pick(RB.school)} · ${title}`, title, team, lv, look, prize: Math.round((300 + lv * 60) / 10) * 10 };
}
function openSchool() {
  AU.play('classroom');
  if (!S.rb) S.rb = randomBattler();
  const avgLv = Math.round(partyInsects().reduce((a, x) => a + x.lv, 0) / Math.max(1, partyInsects().length));
  const tired = partyInsects().some((b) => b.cond < 30);
  const card = (k) => {
    const o = OPP[k], lv = Math.max(o.lv, avgLv);
    return `<div class="opp"><span class="opp-tag">동아리 연습</span><div class="face">${chibi(CH[o.who].look, k === 'dh' ? 'cool' : 'grin')}</div><b>${o.name}</b><small>${o.sub}</small>
<div class="mini">${o.team.map((id) => bugSvg(id)).join('')}</div><small>상대 곤충 Lv.${lv}</small><p>이기면 600원 · 경험치 45</p>
<button type="button" class="btn pri" data-opp="${k}">배틀 신청</button></div>`;
  };
  const r = S.rb;
  const free = `<div class="opp free"><span class="opp-tag free">자유 배틀</span><div class="face">${chibi(r.look, 'grin')}</div><b>${r.name}</b><small>${r.sub}</small>

<div class="scr-body"><div class="opps four">${['dh', 'sr', 'sw'].map(card).join('')}${free}</div></div>
${tired ? '<div class="scr-tip" style="border-color:#FF5A4A"><b style="color:#FF8A7A">주의</b> · 컨디션이 30보다 낮은 곤충이 팀에 있어요. 배틀에서 힘을 다 내지 못해요.</div>' : ''}
${tutTip('battle', '부원이나 자유 배틀 상대 누구와 붙어도 괜찮아요. 져도 경험치와 상금 200원을 받아요.')}
<div class="scr-tip"><b>자유 배틀</b> · 학교 근처에서 만난 다른 배틀러와 겨뤄요. 상대와 곤충은 매번 달라지고, 처음 보는 곤충은 도감에 기록돼요.</div>`, () => openHub());
  const go = (opp) => { S.modal = false; L.ov.innerHTML = ''; hideHub(); startBattle(() => { if (opp.rand) S.rb = null; openHub(); }, opp); };
  root.querySelectorAll('[data-opp]').forEach((b) => b.addEventListener('click', () => go(b.dataset.opp)));

/* ---------- 곤충 도감 ---------- */
const DEX = ['kabuto', 'stag', 'mantis', 'hornet', 'cicada', 'roach', 'centipede', 'butterfly', 'grasshopper', 'cricket', 'chafer', 'spider', 'fly', 'mosquito', 'diving', 'waterbug', 'dragonfly'];
const dexNo = (id) => String(DEX.indexOf(id) + 1).padStart(3, '0');
function ensureDex() {
  if (!S.dex || typeof S.dex !== 'object') S.dex = {};
  const add = (id) => { if (!SP[id]) return; const e = S.dex[id] || (S.dex[id] = { seen: true, caught: 0, day: S.day || 1 }); e.seen = true; if (!e.caught) e.caught = 1; };
  S.caught.forEach(add); (S.bugs || []).forEach((b) => add(b.id));
}
function markSeen(id) { ensureDex(); if (!S.dex[id]) S.dex[id] = { seen: true, caught: 0, day: 0 }; }
function markCaught(id) {
  ensureDex();
  const e = S.dex[id] || (S.dex[id] = { seen: true, caught: 0, day: 0 });
  const first = !e.caught;
  e.seen = true; e.caught += 1; if (first) e.day = S.day || 1;
  return first;
}
const dexCount = () => { ensureDex(); const v = Object.values(S.dex); return { seen: v.length, caught: v.filter((e) => e.caught).length }; };
const kindChip = (k) => `<span class="tchip" style="background:${KIND_COL[k]};color:#fff">${k}</span>`;
const typeChip = (t) => `<span class="tchip" style="background:${TYPE_COL[t]};color:#fff">${t}</span>`;
let dexSel = 'kabuto';
function openDex() {
  ensureDex(); AU.play('home');
  const draw = () => {
    const c = dexCount();
    const cards = DEX.map((id) => {
      const e = S.dex[id], st = e ? (e.caught ? 'got' : 'seen') : 'none';
      return `<button type="button" class="dx ${st}${id === dexSel ? ' on' : ''}" data-dx="${id}"><span class="no">No.${dexNo(id)}</span>${bugSvg(id)}<b>${st === 'none' ? '???' : SP[id].name}</b>${st === 'got' ? '<i>●</i>' : ''}</button>`;
    }).join('');
    const id = dexSel, e = S.dex[id], s = SP[id], sp = SPOTS.find((x) => x.id === id), st = e ? (e.caught ? 'got' : 'seen') : 'none';
    let det;
    if (st === 'none') det = `<div class="dx-art none">${bugSvg(id, 'width="480" height="300"')}</div><h3>No.${dexNo(id)} ???</h3><p class="dx-msg">아직 발견하지 못한 곤충이에요.<br>채집터 곳곳을 살펴보거나 배틀에서 만나 보세요.</p>`;
    else if (st === 'seen') det = `<div class="dx-art seen">${bugSvg(id, 'width="480" height="300"')}</div><h3>No.${dexNo(id)} ${s.name}</h3><div class="dx-chips">${typeChip(s.type)} ${kindChip(s.hab)}</div><p class="dx-msg">본 적은 있지만 아직 잡지 못했어요.<br><b>${AREAS[sp.area].n}</b>의 ${sp.place}에서 찾아보세요.</p>`;
    else {
      const stats = STAT_NAMES.map(([k, n]) => `<div class="st"><span>${n}</span><span>${s[k]}</span><span class="mbar"><i style="width:${Math.min(100, s[k] / (k === 'hp' ? 600 : k === 'spd' ? 110 : 45) * 100)}%;background:${STAT_COL[k]}"></i></span><span></span></div>`).join('');
      det = `<div class="dx-top"><div class="dx-art">${bugSvg(id, 'width="480" height="300"')}</div><div class="dx-info"><h3>No.${dexNo(id)} ${s.name}</h3><div class="dx-chips">${typeChip(s.type)} ${kindChip(s.hab)}</div>
<p class="dx-row"><b>사는 곳</b>${AREAS[sp.area].n} · ${sp.place}</p><p class="dx-row"><b>잡은 수</b>${e.caught}마리 · ${e.day}일째에 처음 잡았어요</p><p class="dx-row"><b>종류 특성</b>${KIND_INFO[s.hab]}</p></div></div>
<p class="dx-fact">${sp.fact}</p><div class="dx-bot"><div class="stats"><small>기본 능력치</small>${stats}</div><div class="skl"><small>기술</small>${['a', 'q', 'w', 'e', 'r'].map((k) => `<div class="${k === 'r' ? 'r' : ''}"><b>${k.toUpperCase()}</b><span style="color:#fff">${s[k].n}</span><span>${k === 'a' ? '' : '기력 ' + s[k].cost}</span><span>${skDesc(s[k])}</span></div>`).join('')}</div></div>`;
    }
    const root = openScr('dex', `${scrHead(`곤충 도감 <small class="dx-count">발견 ${c.seen} · 채집 ${c.caught} / ${DEX.length}</small>`)}
<div class="scr-body"><div class="dx-grid">${cards}</div><div class="dx-detail">${det}</div></div>`, () => openHub());
    root.querySelectorAll('[data-dx]').forEach((b) => b.addEventListener('click', () => { dexSel = b.dataset.dx; AU.sfx('page'); draw(); }));
  };
  draw();
}

/* ---------- 메뉴 ---------- */
function onoffRow(key, label) {
  return `<div class="row"><span>${label}</span><div class="seg" role="group" aria-label="${label}"><button type="button" data-${key}="1" aria-pressed="${prefs[key]}">켜기</button><button type="button" data-${key}="0" aria-pressed="${!prefs[key]}">끄기</button></div></div>`;
}
function bindOnOff(root) {
  ['bgm', 'sfx'].forEach((key) => root.querySelectorAll(`[data-${key}]`).forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation(); AU.init();
    prefs[key] = b.dataset[key] === '1'; store.set(PREF_KEY, prefs);
    root.querySelectorAll(`[data-${key}]`).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    if (key === 'bgm') AU.setBgm(prefs.bgm); else AU.setSfx(prefs.sfx);
  })));
}
function speedSeg() {
  return `<div class="seg" role="group" aria-label="텍스트 속도">${[['slow', '느리게'], ['normal', '보통'], ['fast', '빠르게']].map(([k, l]) =>
    `<button type="button" data-speed="${k}" aria-pressed="${prefs.speed === k}">${l}</button>`).join('')}</div>`;
}
function bindSpeed(root) {
  root.querySelectorAll('[data-speed]').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation(); prefs.speed = b.dataset.speed; store.set(PREF_KEY, prefs);
    root.querySelectorAll('[data-speed]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));

}

<button type="button" id="setBtn">설정</button>
</div></div></div>`;
  $('#newBtn').addEventListener('click', newGame);
  $('#contBtn').addEventListener('click', () => { const s = store.get(SAVE_KEY); if (s) resume(s); });
  $('#setBtn').addEventListener('click', openSettings);
  $('#newBtn').focus({ preventScroll: true });
}
function openSettings() {
  const wrap = document.createElement('div');
  wrap.className = 'ov dim-ov';
  wrap.innerHTML = `<div class="panel" role="dialog" aria-label="설정"><h2>설정</h2>
<div class="row"><span>텍스트 속도</span>${speedSeg()}</div>
${onoffRow('bgm', '배경음악')}${onoffRow('sfx', '효과음')}
<button type="button" class="wide warn" id="wipeBtn">저장 데이터 지우기</button>
<button type="button" class="wide primary" id="closeBtn">닫기</button><p style="margin:0;text-align:center;font-size:13px;font-weight:700;color:#6A6A72">인섹터스 리그 · 버전 ${VERSION}</p></div>`;
  L.ov.appendChild(wrap);
  bindSpeed(wrap); bindOnOff(wrap); AU.sfx('open');
  let armed = false;
  $('#wipeBtn').addEventListener('click', () => {
    if (!armed) { armed = true; $('#wipeBtn').textContent = '한 번 더 누르면 지워져요'; return; }
    store.del(SAVE_KEY); $('#wipeBtn').textContent = '지웠어요'; const c = $('#contBtn'); if (c) c.disabled = true;
  });
  $('#closeBtn').addEventListener('click', () => wrap.remove());
}
function startGame() {
  L.ov.innerHTML = ''; $('#menuBtn').hidden = false; hideHub();
  S.mode = 'story'; S.queue = []; S.paused = false; S.talking = false; S.modal = false;
  run();
}
function newGame() {
  store.del(SAVE_KEY);
  S.ip = 0; Object.assign(S, freshProgress());
  SPOTS.forEach((s) => { s.cool = 0; });
  startGame();
}
function resume(sv) {
  S.ip = Math.max(0, Math.min(SCRIPT.length - 1, sv.ip | 0));
  S.caught = Array.isArray(sv.caught) ? sv.caught.filter((id) => SPOTS.some((s) => s.id === id)) : [];
  S.lastWin = !!sv.lastWin;
  S.bugs = Array.isArray(sv.bugs) ? sv.bugs.map(cleanBug).filter(Boolean) : [];
  S.party = Array.isArray(sv.party) ? sv.party.map(String) : [];
  S.money = Math.max(0, sv.money | 0);
  S.items = {}; for (const k in ITEMS) S.items[k] = Math.max(0, (sv.items && sv.items[k]) | 0);
  S.day = Math.max(1, sv.day | 0 || 1);
  S.tut = sv.tut && typeof sv.tut === 'object' ? Object.fromEntries(TODO.map(([k]) => [k, !!sv.tut[k]])) : null;
  S.tutDone = !!sv.tutDone; S.gifted = !!sv.gifted;
  S.dex = {}; if (sv.dex && typeof sv.dex === 'object') for (const id of DEX) { const e = sv.dex[id]; if (e) S.dex[id] = { seen: true, caught: Math.max(0, e.caught | 0), day: Math.max(0, e.day | 0) }; }
  ensureDex();
  if (S.bugs.length) ensureBugs();
  let scene = null; const after = [];
  for (let i = 0; i < S.ip; i++) {
    const c = SCRIPT[i];
    if (c.t === 'scene') { scene = c.id; after.length = 0; }
    else if (c.t === 'show' || c.t === 'pos') after.push(c);
  }
  L.ov.innerHTML = ''; $('#menuBtn').hidden = false; hideHub();
  if (scene && SCRIPT[S.ip].t !== 'field' && SCRIPT[S.ip].t !== 'hub') {
    setScene(scene);
    after.forEach((c) => {
      if (c.t === 'show') actors[c.who].el.hidden = false;
      else { const p = SCENES[scene].pos[c.who][c.pos]; placeActor(c.who, p.x, p.y, p.s); }
    });
  }
  S.mode = 'story'; S.queue = [];
  run();
}

/* ---------- 입력 ---------- */
stage.addEventListener('pointerdown', (e) => {
  AU.init();
  if (e.target.closest('button') || e.target.closest('.joy')) return;
  if (S.paused) return;
  if (E) { if (E.active && E.g && E.g.tap) E.g.tap(); return; }
  if (S.mode === 'battle') return;
  if (S.onAdvance) { S.onAdvance(); return; }
  if (S.mode === 'field' && !S.talking && !S.modal) {
    const p = toWorld(toStage(e));
    F.tx = Math.max(40, Math.min(1240, p.x)); F.ty = Math.max(400, Math.min(630, p.y));
  }
});
stage.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (b && !b.hasAttribute('data-quiet')) AU.sfx('click');
});
window.addEventListener('keyup', (e) => {
  if (E && E.active && E.g && (e.code === 'Space' || e.code === 'Enter')) E.g.press(false);
});
window.addEventListener('keydown', (e) => {
  AU.init();
  keys[e.code] = true;
  if (S.paused) return;
  if (S.mode === 'battle' && B && !B.over) {
    if (e.code === 'KeyA') { e.preventDefault(); if (!e.repeat) command({ kind: 'basic' }); return; }
    const k = { KeyQ: 'q', KeyW: 'w', KeyE: 'e', KeyR: 'r' }[e.code];
    if (k) { e.preventDefault(); if (!e.repeat) command({ kind: 'skill', k }); return; }
    const d = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (d != null) { if (!e.repeat) command({ kind: 'swap', idx: d }); return; }
  }
  if (E) {
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat && E.active && E.g) E.g.press(true); }
    return;
  }
  if (e.code === 'Space' || e.code === 'Enter') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !S.onAdvance) return;
    if (S.onAdvance) { e.preventDefault(); S.onAdvance(); }
    else if (S.mode === 'field') { e.preventDefault(); tryInteract(); }
  }
  if (e.code.startsWith('Arrow') && S.mode === 'field') e.preventDefault();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });
window.addEventListener('blur', () => { keys = {}; });

showLoading();
})();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}
</script>
