<style>
/* 16:9 무대 하나를 화면에 맞춰 축소·확대하는 게임 프레임. 만화 원고지 + 잉크 + 경기장 밤 */
:root {
  --night: #0E1220;
  --paper: #EFE8D8;
  --ink: #111114;
  --red: #C8232C;
  --lime: #B8F24A;
  --sky: #4FD1FF;
  --gold: #FFD23F;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: #F4F7FB; font-family: var(--body);
  overflow: hidden; box-sizing: border-box; padding: 0;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
#bg, #bugs, #actors, #front { touch-action: none; }
.berserk .b-img svg { filter: drop-shadow(0 0 8px #B04AFF) drop-shadow(0 0 20px #7A1AE0) saturate(1.25); animation: bzk 1.2s ease-in-out infinite alternate; }
@keyframes bzk { from { filter: drop-shadow(0 0 6px #B04AFF) drop-shadow(0 0 14px #7A1AE0) saturate(1.2) } to { filter: drop-shadow(0 0 14px #D08AFF) drop-shadow(0 0 30px #9A3AFF) saturate(1.5) } }
.nat-bar { position: relative; flex: none; margin: 10px 24px 0; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #1E2636; border-left: 6px solid var(--gold); font-size: 17px; font-weight: 700; } .nat-bar b { color: var(--gold); }
.nat-tabs { position: relative; flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 24px 0; }
.nat-tab { height: 40px; padding: 0 14px; border: 3px solid #3A4458; background: #1A2030; color: #C9D3E2; font-size: 17px; font-weight: 900; }
.nat-tab.on { background: var(--gold); color: var(--ink); border-color: var(--ink); }
.nat-head { position: relative; flex: none; margin: 10px 24px 0; padding: 8px 16px; background: var(--jk); border: 3px solid #0A0D16; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; } .nat-head b { font-family: var(--display); font-weight: 400; font-size: 24px; } .nat-head span { font-size: 16px; font-weight: 700; color: #E8ECF4; }
.nat-grid { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-content: start; }
.nat-card { background: #1A2030; border: 3px solid #3A4458; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.nat-card.cap { border-color: var(--gold); }
.nat-card .face { width: 88px; height: 88px; overflow: hidden; border: 3px solid var(--paper); background: var(--paper); box-sizing: border-box; } .nat-card .face svg { width: 170px; height: 221px; margin: -32px 0 0 -44px; }
.nat-card b { font-family: var(--display); font-weight: 400; font-size: 22px; } .nat-card small { font-size: 15px; font-weight: 700; color: #C9D3E2; }
.nat-card .mini { display: flex; gap: 2px; } .nat-card .mini svg { width: 58px; height: 36px; }
.nat-card p { margin: 0; font-size: 13px; font-weight: 700; color: var(--gold); word-break: keep-all; } .nat-card i { font-size: 13px; color: #E8E0D0; word-break: keep-all; }
.nat-q { font-size: 28px; color: #6A7488; }
.opps.regions { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 10px; overflow-y: auto; }
.opps.regions .fs { padding-bottom: 8px; gap: 3px; } .opps.regions .fs-bg { height: 52px; } .opps.regions .fs b { font-size: 20px; } .opps.regions .fs > small { font-size: 15px; } .opps.regions .fs-list { min-height: 0; } .opps.regions .fs-bug { width: 96px; } .opps.regions .fs-bug svg { width: 70px; height: 40px; } .fs-more { font-size: 14px !important; color: #9AA3B5 !important; } .opps.regions .fs .btn { height: 40px; font-size: 17px; }
.fs-list.dense .fs-bug { width: 56px; } .fs-list.dense .fs-bug svg { width: 50px; height: 30px; } .fs-list.dense .fs-bug small { font-size: 12px; }
.bug.clue { width: 120px; height: 80px; transform: none !important; animation: cluePulse 1.4s ease-in-out infinite; }
@keyframes cluePulse { 50% { filter: drop-shadow(0 0 14px #C08AFF) } }
.clue-count { background: #2A1A3A !important; border-color: #B05AFF !important; color: #F0E0FF; font-weight: 900; }
.clue-box h2 { text-align: center; } .clue-art { align-self: center; } .clue-art svg { width: 180px; height: 120px; }
.clue-say { margin: 0; font-size: 18px; font-weight: 700; color: #3A2A4A; } .clue-say b { color: #6A2AB0; margin-right: 6px; }
.ov.end.dark { background: radial-gradient(ellipse at 50% 30%, #3A1A5A, #0A0612 70%) !important; color: #F0E0FF; } .ov.end.dark .chip { background: #3A1A5A !important; color: #E8C8FF !important; }
.ov.end.dark .team { color: var(--ink); }
.m-bugs.bz svg { filter: drop-shadow(0 0 6px #B04AFF) drop-shadow(0 0 12px #7A1AE0); }
.fitl { margin-top: 6px; font-size: 15px; } .fitl summary { cursor: pointer; font-weight: 900; color: #9AE06A; list-style: none; } .fitl summary::-webkit-details-marker { display: none; }
.fitl summary::after { content: ' ▼'; font-size: 12px; } .fitl[open] summary::after { content: ' ▲'; }
.fitl div { margin-top: 6px; max-height: 120px; overflow-y: auto; padding: 6px 8px; background: #121722; border: 2px solid #3A4458; font-size: 14px; line-height: 1.5; color: #C9D3E2; word-break: keep-all; }
.fit-all { margin: 6px 0 0; font-size: 15px; font-weight: 900; color: #9AE06A; }


/* ---------- 뉴스 · 유대 각성 ---------- */
.ov.news { background: rgba(4,6,16,.84); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.news-tv { width: 860px; max-width: 94%; border: 16px solid #1A1A20; border-radius: 20px; background: #0E1630; box-shadow: 0 0 0 4px #3A3A44, 0 24px 60px #000; overflow: hidden; color: #fff; animation: tvOn .5s ease-out; }
@keyframes tvOn { 0% { transform: scaleY(.02); filter: brightness(3); } 60% { transform: scaleY(1); filter: brightness(1.6); } 100% { filter: none; } }
.news-tv .nt-top { background: #C8232C; padding: 8px 20px; font-weight: 900; font-size: 20px; display: flex; justify-content: space-between; letter-spacing: 1px; }
.news-tv .nt-top i { font-style: normal; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.news-tv .nt-body { padding: 26px 30px; display: flex; gap: 24px; align-items: center; }
.news-tv .nt-body svg { flex: none; }
.news-tv h3 { margin: 0 0 10px; font-size: 30px; line-height: 1.3; color: #FFE070; }
.news-tv p { margin: 0; font-size: 20px; line-height: 1.55; color: #E6E9F4; }
.news-tv .nt-tick { background: #FFD23F; color: #111; font-weight: 900; font-size: 19px; padding: 8px 0; white-space: nowrap; overflow: hidden; }
.news-tv .nt-tick span { display: inline-block; padding-left: 100%; animation: tick 14s linear infinite; }
@keyframes tick { to { transform: translateX(-100%); } }
.ov.news .wide { width: 320px; }
.awk-ov { position: absolute; inset: 0; z-index: 70; background: radial-gradient(circle at 50% 42%, #3A2A08 0%, #0A0812 65%); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; color: #fff; }
.awk-rays { position: absolute; left: 50%; top: 40%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; background: repeating-conic-gradient(from 0deg, rgba(255,214,90,.26) 0 6deg, transparent 6deg 18deg); animation: awkSpin 9s linear infinite, awkIn 1.4s ease-out both; border-radius: 50%; }
@keyframes awkSpin { to { transform: rotate(360deg); } }
@keyframes awkIn { from { opacity: 0; transform: scale(.2); } }
.awk-art { position: relative; animation: awkGlow 1.8s ease-in-out both; }
.awk-art::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, #fff 0%, rgba(255,240,180,.9) 25%, transparent 62%); animation: awkFlash 1.8s ease-out both; pointer-events: none; }
.awk-art svg { filter: drop-shadow(0 0 12px #FFE070) drop-shadow(0 0 30px #FFB020); }
@keyframes awkGlow { 0% { transform: scale(.9); filter: brightness(1); } 45% { transform: scale(1.04); filter: brightness(2.6); } 70% { transform: scale(1.08); filter: brightness(3.4); } 100% { transform: scale(1); filter: brightness(1.1); } }
@keyframes awkFlash { 0%, 40% { opacity: 0; } 70% { opacity: 1; } 100% { opacity: 0; } }
.awk-txt { position: relative; text-align: center; animation: awkTxt .6s 1.6s ease-out both; }
@keyframes awkTxt { from { opacity: 0; transform: translateY(20px); } }
.awk-txt .chip { display: inline-block; background: linear-gradient(90deg, #FFB020, #FFE070); color: #2A1A00; font-weight: 900; padding: 4px 18px; border-radius: 999px; font-size: 18px; letter-spacing: 2px; }
.awk-txt h2 { margin: 10px 0 6px; font-size: 40px; color: #FFE070; text-shadow: 0 0 18px #FFB020, 0 3px 0 #000; }
.awk-txt p { margin: 0 0 12px; font-size: 18px; color: #F4E8C8; }
.awk-st { display: grid; grid-template-columns: repeat(4, auto); gap: 6px 14px; justify-content: center; margin-bottom: 16px; font-size: 17px; font-weight: 800; }
.awk-st span { background: rgba(0,0,0,.45); border: 2px solid #6A5020; border-radius: 10px; padding: 4px 10px; }
.awk-st b { color: #9AE06A; }
.awk-txt .wide { width: 320px; }
#awOk, #nwOk { height: 58px; font-size: 22px; font-weight: 900; border: 3px solid #111114; border-radius: 12px; cursor: pointer; }
#awOk { background: linear-gradient(90deg, #FFB020, #FFE070); color: #2A1A00; }
#nwOk { background: #C8232C; color: #fff; }
.b-unit.awk .b-img svg { filter: drop-shadow(0 0 8px #FFE070) drop-shadow(0 0 22px #FFB020); animation: awkPulse 1.6s ease-in-out infinite alternate; }
@keyframes awkPulse { to { filter: drop-shadow(0 0 14px #FFF0A0) drop-shadow(0 0 34px #FFC040); } }
.hd-top .art.awk svg { filter: drop-shadow(0 0 8px #FFE070) drop-shadow(0 0 20px #FFB020); }
.awtag { display: inline-block; margin-left: 6px; padding: 2px 10px; border-radius: 999px; background: linear-gradient(90deg, #FFB020, #FFE070); color: #2A1A00; font-weight: 900; font-size: .75em; vertical-align: middle; }
b.aw { color: #FFD23F; }
.awk-p { color: #FFE070 !important; font-weight: 800; }
.btn.awk-btn { background: linear-gradient(90deg, #FFB020, #FFE070) !important; color: #2A1A00 !important; animation: awkPulseB 1s ease-in-out infinite alternate; }
@keyframes awkPulseB { to { box-shadow: 0 0 18px #FFD040; } }
.big-ui .ov.news .news-tv, .big-ui .ov.news .wide, .big-ui .awk-txt { zoom: calc(var(--uiz) * .85); }

/* 배틀 겹침 순서: 곤충(깊이 정렬 z≈수백)보다 글자·팁이 위로 */
#battle .plate { z-index: 1000; } #battle .b-match { z-index: 1010; } #battle .b-top, #battle .b-panel { z-index: 1020; } #battle .banner, #battle .toast { z-index: 1030; }
/* 배틀 팁·배너는 위쪽 띠에, 상성 표시는 경기장 아래쪽에: 곤충을 가리지 않게 */
#battle .toast { top: 78px; padding: 5px 16px; font-size: 17px; line-height: 1.35; max-width: 760px; }
#battle .banner { top: 78px; padding: 4px 20px; font-size: 22px; }
#battle .b-match { top: auto; bottom: 246px; }
/* 배틀 팁 · 기술 이름: 명령 패널 머리줄 */
#bTip { display: none; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; font-weight: 900; color: #FFD23F; }
.bp-h.tipping #bAsk { display: none; } .bp-h.tipping #bTip { display: block; animation: fade .25s ease-out; }
#bTip.ban { color: #7CFC6A; font-size: 19px; } #bTip.ban.foe { color: #FF9A4A; }

/* ---------- 추가 시스템 ---------- */
.wx-ov { position: absolute; inset: 0; pointer-events: none; }
.wx-ov.night { background: radial-gradient(ellipse at 50% 55%, rgba(10,14,46,.18) 0%, rgba(6,8,30,.55) 75%); }
.wx-ov.rain { background-image: repeating-linear-gradient(105deg, rgba(210,225,255,.28) 0 2px, transparent 2px 22px); background-size: 100% 80px; animation: rainMv .45s linear infinite; }
@keyframes rainMv { to { background-position: -14px 80px; } }
.wx-ov.snow { background-image: radial-gradient(circle, rgba(255,255,255,.9) 0 2.5px, transparent 3px), radial-gradient(circle, rgba(255,255,255,.7) 0 2px, transparent 2.5px); background-size: 90px 90px, 130px 130px; animation: snowMv 6s linear infinite; }
@keyframes snowMv { to { background-position: 30px 90px, -20px 130px; } }
.fs-time { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px 14px 0; font-weight: 900; color: #F4F7FB; flex-wrap: wrap; }
.fs-time .seg2 button { height: 44px; padding: 0 18px; border: 3px solid #111114; background: #2A3244; color: #fff; font-weight: 900; font-size: 17px; }
.fs-time .seg2 button.on { background: #FFD23F; color: #111114; }
.fs-time small { color: #C9BFA8; font-weight: 700; }
.trtag, .hdtag { display: inline-block; margin-left: 6px; padding: 1px 9px; border-radius: 999px; font-size: .72em; font-weight: 900; vertical-align: middle; }
.trtag { background: #3A5A8A; color: #E8F0FF; } .hdtag { background: #6A4A2A; color: #FFF0D0; }
.mode-bar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 10px 24px 0; }
.mode-btn { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; padding: 8px 14px; min-height: 60px; border: 3px solid #111114; background: #FFF6DE; box-shadow: 4px 4px 0 #111114; cursor: pointer; }
.mode-btn i { grid-row: 1 / 3; font-style: normal; font-size: 30px; } .mode-btn b { font-size: 18px; } .mode-btn small { font-size: 13px; color: #6A5A40; font-weight: 700; }
.rank-box { display: flex; gap: 18px; align-items: center; padding: 14px 18px; margin-bottom: 12px; background: #161A24; border: 4px solid var(--rc); color: #fff; }
.rank-emb { font-size: 64px; } .rank-box small { color: #9AA3B5; font-weight: 700; } .rank-box > div > b { display: block; font-family: var(--display); font-size: 40px; color: var(--rc); font-weight: 400; }
.rank-box p { margin: 4px 0 0; font-size: 15px; color: #C9D3E2; } .stars .star { font-style: normal; font-size: 28px; color: #3A4458; margin-right: 4px; } .stars .star.on { color: #FFD23F; }
.rk-rw { display: flex; flex-wrap: wrap; gap: 6px; } .rk-rw span { border: 2px solid; padding: 2px 8px; font-size: 13px; font-weight: 800; border-radius: 6px; }
.pt-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 8px 0 12px; }
.pt { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border: 3px solid #111114; background: #FFF6DE; cursor: pointer; }
.pt.on { background: #FFD23F; box-shadow: 0 0 0 4px #C8232C inset; } .pt .face { width: 74px; height: 74px; } .pt .mini svg { width: 80px; height: 50px; }
.tag-p { margin: 0 0 8px; font-size: 16px; font-weight: 700; color: #F4F7FB; background: rgba(0,0,0,.35); padding: 8px 12px; }
.tag-vs { display: flex; align-items: center; justify-content: center; gap: 22px; margin-bottom: 12px; padding: 10px; background: #161A24; border: 3px solid #3A4458; color: #fff; text-align: center; }
.tag-vs > span { font-family: var(--display); font-size: 40px; color: #FFD23F; } .tag-vs small { color: #9AA3B5; font-weight: 700; } .tag-vs .mini svg { width: 72px; height: 45px; }
.ct-head { background: #FFF6DE; border: 3px solid #111114; padding: 10px 14px; margin-bottom: 10px; } .ct-head p { margin: 4px 0; font-size: 15px; } .ct-head small { font-weight: 800; color: #6A4A2A; }
.ct-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ct-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #161A24; border: 3px solid #3A4458; color: #fff; }
.ct-row .idl svg { width: 96px; height: 60px; } .ct-row > div { flex: 1; display: flex; flex-direction: column; } .ct-row small { color: #9AA3B5; font-weight: 700; }
.ct-sc { font-family: var(--display); font-size: 24px; color: #FFD23F; }
.ct-res { background: #FFF6DE; border: 4px solid #111114; padding: 14px 18px; text-align: center; } .ct-res h2 { margin: 0; font-family: var(--display); font-size: 44px; font-weight: 400; color: #C8232C; }
.ct-res ol { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.ct-res li { display: flex; align-items: center; gap: 10px; padding: 3px 10px; background: #fff; border: 2px solid #D8CCB0; } .ct-res li.me { background: #FFE070; border-color: #C8232C; }
.ct-res li > span:first-child { width: 28px; font-weight: 900; font-size: 20px; } .ct-res li .face { width: 40px; height: 40px; } .ct-res li b { flex: 1; } .ct-res li .mini svg { width: 64px; height: 40px; } .ct-res li em { font-style: normal; font-weight: 900; width: 70px; text-align: right; }
.tr-x { display: flex; align-items: center; gap: 6px; justify-content: center; } .tr-x > div { display: flex; flex-direction: column; align-items: center; } .tr-x svg { width: 90px; height: 56px; } .tr-x > span { font-size: 28px; font-weight: 900; }
.tr-sel { width: 100%; height: 42px; font-size: 15px; font-weight: 700; border: 3px solid #111114; }
.opp.done { opacity: .6; }
.msn-list { display: flex; flex-direction: column; gap: 8px; }
.msn { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #161A24; border: 3px solid #3A4458; color: #fff; }
.msn > div { flex: 1; display: flex; flex-direction: column; gap: 4px; } .msn b { font-size: 18px; } .msn small { color: #9AA3B5; font-weight: 700; }

.msn-list { width: 100%; max-width: 980px; margin: 0 auto; }
.mode-btn { color: #111114; } .mode-btn small { color: #6A5A40; }
.pt b { color: #111114; } .pt b { color: #111114; } .pt .face { overflow: hidden; } .pt .face svg { width: 142px; height: 185px; margin: -28px 0 0 -37px; }

.ct-head, .ct-res { color: #111114; } .ct-row { min-width: 0; }

/* 길거리 도전자 */

.chal { width: 820px; max-width: 94%; background: #FFF6DE; border: 5px solid #111114; box-shadow: 10px 10px 0 #C8232C; color: #111114; animation: chalIn .35s ease-out; }
@keyframes chalIn { from { transform: scale(.85) rotate(-2deg); opacity: 0; } }

/* 배틀 모션: 관절 포즈, 걷기, 날갯짓, 화면 흔들림, 타격 효과 */

@keyframes q1 { 20% { transform: translate(-8px, 4px) } 40% { transform: translate(7px, -5px) } 60% { transform: translate(-5px, 3px) } 80% { transform: translate(3px, -2px) } }
@keyframes q2 { 10% { transform: translate(-16px, 10px) } 25% { transform: translate(14px, -12px) } 40% { transform: translate(-12px, 8px) } 55% { transform: translate(10px, -6px) } 70% { transform: translate(-6px, 4px) } 85% { transform: translate(3px, -2px) } }
.b-unit { left: 0; top: 0; will-change: transform; }
.b-move { transform-origin: 240px 250px; will-change: transform; }

@keyframes nod { 50% { transform: rotate(-5deg) } }
.pose-lift .hd { transform: rotate(-30deg); }
.pose-strike .hd { transform: rotate(12deg); }
.pose-raise .arm { transform: rotate(-58deg); }
.pose-strike .arm { transform: rotate(42deg); }
.pose-lift .arm { transform: rotate(-30deg); }
.pose-open .jawU, .pose-lift .jawU { transform: rotate(-18deg); } .pose-open .jawL, .pose-lift .jawL { transform: rotate(18deg); }
.pose-bite .jawU { transform: rotate(8deg); } .pose-bite .jawL { transform: rotate(-8deg); }

.pose-brace { filter: drop-shadow(0 0 16px #4FD1FF); }
.fx { position: absolute; pointer-events: none; z-index: 6; }
.fx-burst { width: 160px; height: 160px; margin: -80px 0 0 -80px; animation: burst .38s ease-out forwards; }

.fx-slash { width: 260px; height: 220px; margin: -110px 0 0 -130px; }

@keyframes slash { 60% { stroke-dashoffset: 0; opacity: 1 } 100% { stroke-dashoffset: 0; opacity: 0 } }

@keyframes ring { from { transform: scale(.3); opacity: 1 } to { transform: scale(1.2); opacity: 0 } }

/* 메인 화면 */
#hubL { z-index: 25; background: #7EC0E6; }
#hubL[hidden] { display: none; }
.hub-bg { position: absolute; inset: 0; } .hub-bg svg { width: 100%; height: 100%; display: block; }
.hub-top { position: absolute; left: 24px; top: 20px; display: flex; gap: 10px; }
.chipbox { padding: 8px 16px; background: var(--ink); border: 3px solid var(--paper); color: #fff; display: flex; flex-direction: column; gap: 2px; }
.chipbox small { font-size: 15px; color: #C9BFA8; font-weight: 700; } .chipbox b { font-family: var(--display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.loc { position: absolute; width: 214px; padding: 8px 8px 10px; box-sizing: border-box; background: var(--paper); border: 4px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .12s, box-shadow .12s; }
.loc:hover { transform: translateY(-4px); box-shadow: 8px 10px 0 var(--ink); }
.loc:active { transform: translateY(2px); box-shadow: 3px 3px 0 var(--ink); }
.loc svg { width: 190px; height: 130px; display: block; border: 2px solid var(--ink); }
.loc b { font-family: var(--display); font-weight: 400; font-size: 26px; } .loc small { font-size: 16px; font-weight: 700; color: #4A4A52; }
.loc .badge { position: absolute; top: -16px; right: -14px; padding: 3px 10px; background: var(--red); color: #fff; font-size: 17px; font-weight: 900; border: 3px solid var(--ink); animation: pulse 1s ease-in-out infinite; }
.hub-side { position: absolute; right: 24px; top: 92px; width: 300px; display: flex; flex-direction: column; gap: 12px; }
.side-box { background: rgba(17,17,20,.92); border: 3px solid var(--paper); padding: 12px 14px; color: #fff; display: flex; flex-direction: column; gap: 8px; }
.side-box h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--gold); }
.todo { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; }
.todo i { width: 18px; height: 18px; border: 2px solid var(--paper); flex: none; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 16px; font-weight: 900; }
.todo.done { color: #9AA3B5; text-decoration: line-through; } .todo.done i { background: var(--lime); color: var(--ink); border-color: var(--lime); }
.pm { display: flex; align-items: center; gap: 8px; } .pm svg { width: 64px; height: 40px; flex: none; } .pm div { flex: 1; display: flex; flex-direction: column; gap: 3px; font-size: 16px; font-weight: 900; }
.mbar { display: block; height: 6px; background: #0A0D16; border: 1px solid #5A6478; overflow: hidden; } .mbar i { display: block; height: 100%; }
.hub-tip { position: absolute; left: 24px; bottom: 22px; padding: 10px 18px; background: rgba(17,17,20,.88); border: 3px solid var(--paper); color: #fff; font-size: 19px; font-weight: 700; white-space: nowrap; }
.hub-tip b { color: #FF8A7A; }

/* 장소 화면 */
.scr { background: #12161F; color: #F4F7FB; display: flex; flex-direction: column; }
.scr-head { position: relative; height: 72px; flex: none; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 16px; background: var(--ink); border-bottom: 4px solid var(--paper); }
.scr-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; }
.scr-head .sp { flex: 1; }
.scr-head .money { font-family: var(--display); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
.btn { height: 46px; padding: 0 18px; border: 3px solid var(--paper); background: var(--ink); color: #fff; font-size: 19px; font-weight: 900; }
.btn.pri { background: var(--gold); color: var(--ink); border-color: var(--ink); box-shadow: 4px 4px 0 #000; }
.btn:disabled { opacity: .4; cursor: default; }
.scr-body { position: relative; flex: 1; min-height: 0; display: flex; gap: 20px; padding: 18px 24px; box-sizing: border-box; }
.scr-tip { position: relative; flex: none; margin: 0 24px 14px; padding: 10px 16px; background: #1E2636; border-left: 6px solid var(--lime); font-size: 18px; font-weight: 700; line-height: 1.5; }
.scr-tip b { color: var(--lime); }
.shop-grid { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-content: start; overflow-y: auto; min-height: 0; }
.item { background: #1A2030; border: 3px solid #3A4458; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.item .ic { display: flex; align-items: flex-start; gap: 12px; } .item .ic svg { width: 56px; height: 56px; flex: none; }
.item b { font-size: 21px; } .item p { margin: 2px 0 0; font-size: 17px; color: #C9D3E2; line-height: 1.45; }
.item .row2 { display: flex; justify-content: space-between; align-items: center; }
.item .price { font-family: var(--display); font-size: 22px; color: var(--gold); }
.item button { height: 40px; padding: 0 20px; border: 0; background: var(--lime); color: var(--ink); font-weight: 900; font-size: 18px; }
.item button:disabled { background: #3A4458; color: #9AA3B5; cursor: default; }
.bag { width: 270px; flex: none; background: #1A2030; border: 3px solid #3A4458; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.bag h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 22px; }
.bag .li { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; padding: 6px 0; border-bottom: 1px solid #2A3244; }
.hab-list { width: 260px; flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 4px; }
.hcard { display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #1A2030; border: 3px solid #3A4458; color: #fff; text-align: left; flex: none; }
.hcard.on { border-color: var(--lime); background: #222B3E; }
.hcard svg { width: 80px; height: 50px; flex: none; } .hcard div { display: flex; flex-direction: column; gap: 2px; font-size: 16px; font-weight: 700; color: #C9D3E2; } .hcard b { font-size: 18px; color: #fff; }
.hcard .tm { align-self: flex-start; padding: 0 6px; background: var(--gold); color: var(--ink); font-size: 14px; font-weight: 900; }
.hab-detail { position: relative; flex: 1; display: grid; grid-template-columns: 360px 1fr; gap: 20px; background: #1A2030; border: 3px solid #3A4458; padding: 14px 18px; }
.hd-left { display: flex; flex-direction: column; gap: 8px; }
.hd-left .art { background: radial-gradient(#3A5A30, #142012); border: 3px solid #3A4458; height: 190px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hd-left .art svg { width: 320px; height: 200px; }
.hd-name { display: flex; align-items: center; gap: 10px; } .hd-name b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.lbar { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 900; color: #C9D3E2; font-variant-numeric: tabular-nums; }
.lbar .mbar { flex: 1; height: 10px; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; } .acts .btn { height: 44px; padding: 0 14px; font-size: 18px; }
.stats { display: flex; flex-direction: column; gap: 7px; }
.st { display: grid; grid-template-columns: 74px 44px 1fr 32px; align-items: center; gap: 8px; font-size: 17px; font-weight: 900; font-variant-numeric: tabular-nums; }
.st .mbar { height: 10px; } .st .plus { color: var(--lime); font-size: 15px; }
.skl { display: flex; flex-direction: column; margin-top: 10px; }
.skl div { display: grid; grid-template-columns: 22px 92px 50px 1fr; gap: 6px; font-size: 16px; font-weight: 700; color: #C9D3E2; padding: 5px 0; border-bottom: 1px solid #2A3244; }
.skl div b { color: var(--sky); } .skl div.r b { color: var(--gold); }
.pop { position: absolute; inset: 0; background: rgba(10,13,22,.9); display: flex; align-items: center; justify-content: center; z-index: 3; }
.pop-box { width: 560px; background: var(--paper); color: var(--ink); border: 5px solid var(--ink); box-shadow: 8px 8px 0 var(--lime); padding: 16px 20px; display: flex; flex-direction: column; gap: 8px; }
.pop-box h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; }
.pop-box .opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; font-weight: 900; text-align: left; }
.pop-box .opt small { font-weight: 700; color: #4A4A52; }
.pop-box .opt:disabled { opacity: .4; cursor: default; }
.pop-box .close { align-self: flex-end; height: 42px; padding: 0 18px; border: 3px solid var(--ink); background: var(--ink); color: #fff; font-weight: 900; }
.opps { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.opp { background: #1A2030; border: 3px solid #3A4458; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.opp .face { width: 120px; height: 120px; overflow: hidden; border: 4px solid var(--paper); background: var(--paper); box-sizing: border-box; }
.opp .face svg { width: 230px; height: 300px; margin: -46px 0 0 -59px; }
.opp b { font-family: var(--display); font-weight: 400; font-size: 26px; } .opp small { font-size: 17px; color: #C9D3E2; font-weight: 700; }
.opp .mini { display: flex; gap: 4px; } .opp .mini svg { width: 80px; height: 50px; }
.opp p { margin: 0; font-size: 17px; font-weight: 900; color: var(--gold); }
.home-ov .bgw { position: absolute; inset: 0; } .home-ov .bgw svg { width: 100%; height: 100%; display: block; }
.dayfade { position: absolute; inset: 0; background: #0A0D16; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; animation: fade .5s ease-out; z-index: 4; }
.dayfade b { font-family: var(--display); font-weight: 400; font-size: 72px; } .dayfade p { margin: 0; font-size: 22px; font-weight: 700; }
.note { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 70; padding: 10px 20px; background: var(--ink); border: 3px solid var(--gold); color: #fff; font-size: 20px; font-weight: 900; white-space: nowrap; animation: msgpop 2s ease-out forwards; pointer-events: none; }

/* 도감 · 채집터 고르기 */
.dexbtn { text-align: left; cursor: pointer; } .dexbtn:hover { border-color: var(--gold); }
.dx-count { font-family: var(--body); font-size: 18px; font-weight: 700; color: #C9D3E2; margin-left: 10px; }
.dx-grid { width: 470px; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; overflow-y: auto; padding-right: 4px; }
.dx { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px 6px; background: #1A2030; border: 3px solid #3A4458; color: #fff; }
.dx.on { border-color: var(--lime); background: #222B3E; }
.dx svg { width: 96px; height: 60px; } .dx b { font-size: 16px; } .dx .no { align-self: flex-start; font-size: 14px; font-weight: 900; color: #9AA3B5; }
.dx.seen svg, .dx-art.seen svg { filter: brightness(0) invert(.35); } .dx.none svg, .dx-art.none svg { filter: brightness(0); opacity: .45; }
.dx i { position: absolute; top: 4px; right: 6px; font-style: normal; color: var(--gold); font-size: 15px; }
.dx-detail { flex: 1; min-width: 0; background: #1A2030; border: 3px solid #3A4458; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.dx-detail h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 28px; }
.dx-top { display: flex; gap: 16px; } .dx-info { display: flex; flex-direction: column; gap: 6px; }
.dx-art { width: 300px; height: 188px; flex: none; background: radial-gradient(#3A5A30, #142012); border: 3px solid #3A4458; display: flex; align-items: center; justify-content: center; overflow: hidden; align-self: flex-start; }
.dx-art svg { width: 290px; height: 181px; }
.dx-chips { display: flex; gap: 6px; } .dx-chips .tchip { font-size: 16px; }
.dx-row { margin: 0; font-size: 17px; font-weight: 700; color: #C9D3E2; line-height: 1.5; } .dx-row b { display: inline-block; width: 74px; color: var(--lime); }
.dx-fact { margin: 0; padding: 10px 14px; background: #12161F; border-left: 5px solid var(--gold); font-size: 18px; line-height: 1.6; }
.dx-msg { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.7; color: #C9D3E2; } .dx-msg b { color: var(--lime); }
.dx-bot { display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; } .dx-bot small { display: block; font-size: 15px; font-weight: 900; color: #9AA3B5; margin-bottom: 4px; }
.dx-bot .skl { margin-top: 0; }
.fs { background: #1A2030; border: 3px solid #3A4458; padding: 0 0 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; overflow: hidden; }
.fs-bg { width: 100%; height: 128px; overflow: hidden; border-bottom: 3px solid #3A4458; } .fs-bg svg { width: 100%; height: 100%; display: block; }
.fs b { font-family: var(--display); font-weight: 400; font-size: 28px; } .fs > small { font-size: 17px; font-weight: 700; color: #C9D3E2; }
.fs-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 4px; padding: 0 8px; min-height: 120px; align-content: flex-start; }
.fs-bug { display: flex; flex-direction: column; align-items: center; width: 66px; } .fs-bug svg { width: 60px; height: 36px; } .fs-bug small { font-size: 13px; line-height: 1.15; word-break: keep-all; text-align: center; font-weight: 700; color: #C9D3E2; }
.fs-bug.seen svg { filter: brightness(0) invert(.35); } .fs-bug.none svg { filter: brightness(0); opacity: .45; }
.tc-kinds { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-size: 16px; font-weight: 700; } .tc-kinds > b { font-size: 18px; }
.tc-card .nt { color: #1E7A7A; font-weight: 900; }

.ver { position: absolute; right: 20px; bottom: 14px; z-index: 5; font-size: 16px; font-weight: 700; color: rgba(255,255,255,.55); font-variant-numeric: tabular-nums; pointer-events: none; }

.opp .line { margin: 0; font-size: 14px; font-weight: 700; color: #E8E0D0; text-align: center; min-height: 40px; }
.opps.four { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.school-body { overflow-y: auto; padding-top: 12px; padding-bottom: 12px; }
.school-body .opps { align-content: start; }
.school-body .opp { padding: 10px 12px; gap: 4px; }
.school-body .opp .face { width: 96px; height: 96px; } .school-body .opp .face svg { width: 184px; height: 240px; margin: -36px 0 0 -48px; }
.school-body .opp b { font-size: 24px; } .school-body .opp small { font-size: 16px; } .school-body .opp p { font-size: 16px; }
.school-body .opp .mini svg { width: 70px; height: 42px; } .school-body .opp .line { min-height: 0; }
.scr.school .scr-tip, .scr.school .story-card { margin-bottom: 8px; }
.scr.school .scr-tip { padding: 7px 14px; font-size: 17px; }
.scr.school .story-card { padding: 8px 16px; }
.opp-tag { align-self: flex-start; padding: 2px 10px; background: #3A4458; color: #fff; font-size: 15px; font-weight: 900; }
.opp-tag.free { background: var(--red); } .opp.free { border-color: var(--red); }

/* 배틀 하단 패널 (다시 만든 판) */
.battle .b-panel { height: 214px; padding: 10px 20px 12px; gap: 18px; background: #0C0F18; }
.bp-h { display: flex; align-items: center; gap: 12px; height: 26px; font-size: 17px; font-weight: 900; color: #F4F7FB; white-space: nowrap; }
.bp-h small { font-size: 15px; font-weight: 700; color: #8A94A8; }
.bp-team { display: flex; flex-direction: column; gap: 6px; flex: none; }
.battle .b-cards { gap: 8px; }
.battle .b-card { width: 148px; padding: 6px 8px; gap: 3px; border-width: 3px; border-color: #2A3244; background: #141926; }
.battle .b-card.on { border-color: var(--lime); background: #1A2232; }
.battle .b-card.can { border-color: #4FD1FF; } .battle .b-card.out { opacity: .4; }
.battle .b-card .top { align-items: center; gap: 4px; font-size: 14px; }
.b-card .slot { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; background: #F4F7FB; color: var(--ink); font-size: 15px; font-weight: 900; }
.b-card .bcs { flex: 1; } .b-card .mt { font-weight: 900; }
.battle .b-card .art { width: 100px; height: 52px; } .battle .b-card .art svg { width: 100px; height: 62px; }
.b-card .bn { font-size: 16px; } .b-card .bn small { color: #9AA3B5; }
.b-card .hpn { font-size: 14px; font-weight: 900; color: #C9D3E2; font-variant-numeric: tabular-nums; text-align: right; margin-top: -2px; }
.battle .b-card button { height: 30px; font-size: 16px; }
.bp-cmd { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.bp-cmd .bp-h { justify-content: space-between; } #bAsk { font-size: 18px; overflow: hidden; text-overflow: ellipsis; }
.en { display: flex; align-items: center; gap: 8px; flex: none; }
.en-l { font-size: 16px; color: var(--sky); }
.en-bar { position: relative; width: 300px; height: 14px; background: #05070C; border: 2px solid var(--sky); }
.en-bar > i { display: block; height: 100%; background: linear-gradient(90deg, #2E9AD0, #4FD1FF); transition: width .25s; }
.en-mk span { position: absolute; top: -16px; transform: translateX(-50%); font-size: 14px; font-weight: 900; color: #5A6478; white-space: nowrap; }
.en-mk span i { position: absolute; left: 50%; top: 14px; width: 2px; height: 16px; margin-left: -1px; background: #5A6478; }
.en-mk span.ok { color: var(--sky); } .en-mk span.ok i { background: #fff; }
.en-mk span.r { color: #8A6A2A; } .en-mk span.r.ok { color: var(--gold); }
.en-n { font-size: 19px; color: var(--sky); font-variant-numeric: tabular-nums; min-width: 66px; } .en small { font-size: 14px; color: #8A94A8; }
.battle .b-btns { display: grid; grid-template-columns: repeat(4, 1fr) 1.35fr; gap: 8px; flex: 1; }
.battle .sk { position: relative; width: auto; padding: 6px 8px; border: 3px solid var(--sky); background: #17233A; color: #fff; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 3px; text-align: left; overflow: visible; cursor: pointer; opacity: 1; filter: none; transition: transform .1s; }
.battle .sk:hover { transform: translateY(-3px); }
.sk-top { display: flex; align-items: center; justify-content: space-between; }
.sk .key { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; background: var(--sky); color: var(--ink); font-family: var(--display); font-size: 19px; }
.sk .role { font-size: 14px; font-weight: 900; color: var(--sky); }
.battle .sk .nm { font-size: 19px; font-weight: 900; color: #fff; line-height: 1.2; }
.sk .ds { font-size: 14px; line-height: 1.3; color: #C8D6E8; min-height: 30px; }
.sk .stc { margin-top: auto; align-self: flex-start; padding: 3px 8px; font-size: 15px; font-weight: 900; white-space: nowrap; }
.sk.ok .stc { background: #2E9A4A; color: #fff; }
.sk.cd .stc { background: #C8721A; color: #fff; }
.sk.en .stc { background: #C8232C; color: #fff; }
.sk.lock .stc { background: #7A4AC8; color: #fff; }
.sk.ko .stc { background: #5A6478; color: #fff; }
.sk .cdv { position: absolute; top: -12px; right: -10px; z-index: 2; display: flex; align-items: baseline; gap: 2px; padding: 3px 9px; background: #FFD23F; color: var(--ink); border: 3px solid var(--ink); font-size: 15px; font-weight: 900; box-shadow: 2px 2px 0 #000; }
.sk .cdv[hidden] { display: none; }
.sk .cdv b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1; }
.battle .sk.ult { background: #4A1A1E; border-color: var(--gold); }
.battle .sk.ult .nm { font-family: var(--display); font-weight: 400; font-size: 21px; }
.sk.ult .key { background: var(--gold); } .sk.ult .role { color: var(--gold); }
.battle .sk.ult.ready { background: #7A1A22; animation: ultglow 1.1s ease-in-out infinite; }
@keyframes ultglow { 50% { box-shadow: 0 0 0 4px rgba(255,210,63,.45), 0 0 22px rgba(255,210,63,.6); } }
.battle .sk.nope { animation: nope .3s linear; }
@keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.plate .hp { position: relative; height: 18px; }
.hpv { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px #000, 0 0 3px #000; font-variant-numeric: tabular-nums; }
.plate .sts span { line-height: 20px; }

/* 곤충 대기 모션 */
.idl { position: relative; display: inline-block; line-height: 0; }
.idl > svg { transform-origin: 50% 70%; }
.idl .wing { animation: buzz .07s linear infinite alternate; }
.idl .lg, .idl .lg2 { transform-box: fill-box; transform-origin: 50% 0; }
.idl .flap { opacity: 0; }
.flap { opacity: 0; }
@keyframes flapw { 0%, 34% { opacity: 0; transform: rotate(0) } 38% { opacity: 1; transform: rotate(-14deg) } 42% { transform: rotate(10deg) } 46% { transform: rotate(-14deg) } 50% { transform: rotate(10deg) } 54% { transform: rotate(-14deg) } 58% { transform: rotate(10deg) } 62% { opacity: 1; transform: rotate(-8deg) } 68%, 100% { opacity: 0; transform: rotate(0) } }

<script>
const VERSION = '0.0.33';
(() => {
const $ = (s) => document.querySelector(s);

/* 폰·태블릿에서 화면이 세로면 무대를 90도 돌려서 가로로 플레이하게 한다. PC는 돌리지 않고 그대로 맞춘다 */

  || (!!window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches);
function fit() {
  const w = app.clientWidth, h = app.clientHeight;
  const rot = IS_PHONE && h > w * 1.05;
  const W = rot ? h : w, H = rot ? w : h;
  // 무대 높이는 720으로 고정하고, 가로는 화면 비율에 맞춰 1280~1600까지 늘린다 (갤럭시 S23 19.5:9 ≈ 1560)

const freshProgress = () => ({ caught: [], lastWin: false, bugs: [], party: [], money: 0, items: {}, day: 1, tut: null, tutDone: false, gifted: false, dex: {}, cages: [], jars: [], eggs: [], deco: {}, goal: null, hubCmd: null, teamName: '', lastDp: -1, wx: 'sun', st: {}, dm: null, ach: [], dexRw: [], rank: null, cw: -1, cbest: null, trades: null, freeDay: undefined, tagOpp: null });
let S = { ip: 0, queue: [], mode: 'title', scene: null, onAdvance: null, paused: false, talking: false, modal: false, fieldIp: 0, tw: null, ...freshProgress() };
const actors = {};

function save() {
  const ip = S.mode === 'field' && !(F && F.free) ? S.fieldIp : S.saveIp;
  store.set(SAVE_KEY, { ip, caught: S.caught, lastWin: !!S.lastWin, bugs: S.bugs, party: S.party, money: S.money | 0, items: S.items, day: S.day, tut: S.tut, tutDone: !!S.tutDone, gifted: !!S.gifted, dex: S.dex, cages: S.cages, jars: S.jars, eggs: S.eggs, deco: S.deco, goal: S.goal || null, teamName: S.teamName || '', lastDp: S.lastDp ?? -1, wx: S.wx || 'sun', st: S.st || {}, dm: S.dm || null, ach: S.ach || [], dexRw: S.dexRw || [], rank: S.rank || null, cw: S.cw ?? -1, cbest: S.cbest || null, trades: S.trades || null, freeDay: typeof S.freeDay === 'number' ? S.freeDay : null });
}

/* ---------- 배우 ---------- */
function addActor(id, d) {
  const el = document.createElement('div');
  el.className = 'actor';
  const look = lookOf(id, d.casual);
  el.innerHTML = `<div class="flip"><div class="inner">${chibi(look, d.face || 'smile')}</div></div>`;
  L.actors.appendChild(el);
  actors[id] = { el, face: d.face || 'smile', look };
  placeActor(id, d.x, d.y, d.s);
  if (d.hidden) el.hidden = true;
}
function placeActor(id, x, y, s) {
  const el = actors[id].el;
  el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.transform = `scale(${s})`;
}
function setFace(id, face) {
  const a = actors[id]; if (!a || !face || a.face === face) return;
  a.face = face; a.el.querySelector('.inner').innerHTML = chibi(a.look || CH[id].look, face);
}
function bounce(id, cls) {
  const a = actors[id]; if (!a) return;
  a.el.classList.remove(cls); void a.el.offsetWidth; a.el.classList.add(cls);
}

function setScene(id) {
  S.scene = id;
  if (MUSIC[id]) AU.play(MUSIC[id]);
  stage.classList.toggle('field', !!SCENES[id].field);
  L.bg.innerHTML = BG[id]();
  L.front.innerHTML = FRONT[id] || '';
  L.bugs.innerHTML = '';
  L.actors.innerHTML = '';
  for (const k in actors) delete actors[k];
  const sc = SCENES[id];
  for (const [who, d] of Object.entries(sc.actors)) addActor(who, d);
  L.hud.innerHTML = sc.place ? `<div class="place-chip"><small>${sc.place[0]}</small><b>${sc.place[1]}</b></div>` : '';
}

/* ---------- 대사 ---------- */
const dlg = $('#dlg'), tag = $('#tag'), txt = $('#dlgText'), more = $('#more');
function showLine(c, done) {
  dlg.hidden = false;
  const ch = c.t === 'say' ? CH[c.who] : null;
  dlg.classList.toggle('narr', !ch);
  tag.hidden = !ch;
  dlg.classList.toggle('has-face', !!ch);
  if (ch) {
    tag.textContent = ch.name; tag.style.background = ch.color; tag.style.color = ch.fg;
    const lk = (actors[c.who] && actors[c.who].look) || ch.look, fk = c.who + ':' + c.face + (lk.cas ? ':c' : ''), fe = $('#dlgFace');
    if (fe.dataset.k !== fk) { fe.innerHTML = chibi(lk, c.face); fe.dataset.k = fk; }
    fe.style.borderColor = ch.color;
  }
  for (const [id, a] of Object.entries(actors)) a.el.classList.toggle('dim', !!ch && id !== c.who);
  if (ch && actors[c.who]) { setFace(c.who, c.face); bounce(c.who, 'talk'); }
  S.pitch = ch ? PITCH[c.who] : 0;
  typewrite(teamText(c.text), done);
}
function typewrite(text, done) {
  clearInterval(S.tw);
  let i = 0; txt.textContent = ''; more.hidden = true;
  const finish = () => {
    clearInterval(S.tw); txt.textContent = text; more.hidden = false;
    S.onAdvance = () => { S.onAdvance = null; done(); };
  };
  S.onAdvance = finish;
  S.tw = setInterval(() => {
    i += 1; txt.textContent = text.slice(0, i);
    if (i % 2 === 0 && /\S/.test(text[i - 1] || '')) AU.blip(S.pitch);
    if (i >= text.length) finish();
  }, SPEED[prefs.speed]);
}

/* ---------- 진행 ---------- */
function run() {
  for (;;) {
    let c, fromQueue = false;
    if (S.queue.length) { c = S.queue.shift(); fromQueue = true; }
    else { S.saveIp = S.ip; c = SCRIPT[S.ip++]; }
    if (!c) return;
    if (!fromQueue) save();
    switch (c.t) {
      case 'scene': setScene(c.id); continue;
      case 'hide': { const a = actors[c.who]; if (a) a.el.hidden = true; continue; }
      case 'show': { const a = actors[c.who]; if (a) { a.el.hidden = false; bounce(c.who, 'pop'); } continue; }
      case 'pos': { const p = SCENES[S.scene].pos[c.who][c.pos]; placeActor(c.who, p.x, p.y, p.s); continue; }
      case 'say': case 'narr': return showLine(c, run);
      case 'chapter': hideDlg(); return showChapter(c, run);
      case 'choice': return showChoice(c);
      case 'field': hideDlg(); S.fieldIp = S.ip - 1; return startField();
      case 'rules': hideDlg(); return showRules(run);
      case 'battle': hideDlg(); return startBattle(run);
      case 'result': S.queue.push(...(S.lastWin ? c.win : c.lose)); continue;
      case 'guide': hideDlg(); return showCards('김새롬의 육성 강의', GUIDE, run, '알겠어요!');
      case 'gift':
        if (!S.gifted) { S.gifted = true; S.money = (S.money || 0) + 1500; S.items.sap = (S.items.sap || 0) + 2; AU.sfx('coin'); }
        continue;
      case 'hub': hideDlg(); return openHub(c.tut, c);
      case 'leaguerules': hideDlg(); return showCards('김새롬의 리그 설명', LEAGUE_RULES, run, '특훈 시작!');
      case 'match': hideDlg(); return startMatch(c.key, run);
      case 'trophy': return showTrophy(run, c);
      case 'teamname': hideDlg(); return showTeamName(run);
      case 'wild': hideDlg(); return startWild(c, run);
      case 'giftbug': hideDlg(); return giveGift(c, run);
      case 'awakenfx': hideDlg(); return showAwakenFx(c, run);
      case 'lead': { ensureBugs(); const lb = S.bugs.find((x) => x.id === c.id); if (lb) { S.party = [lb.uid, ...S.party.filter((u) => u !== lb.uid)].slice(0, 3); save(); } continue; }
      case 'news': hideDlg(); return showNews(c, run);
      case 'awaken': { hideDlg(); const pb = partyInsects(); const ace = pb.find((x) => !x.awake) || pb[0]; if (!ace || ace.awake) { run(); return; } return showAwaken(ace, run, true); }
      case 'search': hideDlg(); return startSearch(c, run);
      case 'exhibit': hideDlg(); return showExhibit(c, run);
      case 'cards': hideDlg(); return showCards(c.title, CARDSETS[c.set], run, c.btn || '알겠어요!');
      case 'daypass': hideDlg(); return showDayPass(run, S.ip - 1);
      case 'end': hideDlg(); return showEnd();
    }
  }
}

const GAMES = {
  ring(nets, sp) {
    const T = 1.7 - (3 - nets) * 0.25; let t = 0, r = 230;
    return {
      tip: '하얀 원이 금색 고리에 딱 겹칠 때 채집망을 던지세요!',
      html: `<svg class="ring-svg" viewBox="0 0 1280 720" aria-hidden="true"><circle cx="640" cy="300" r="74" fill="none" stroke="#FFD23F" stroke-width="10"/><circle id="gRing" cx="640" cy="300" r="230" fill="none" stroke="#fff" stroke-width="6"/></svg><button type="button" class="g-btn" id="gBtn">채집망 던지기</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        t = (t + dt) % T; r = 230 - (t / T) * 200;
        const el = $('#gRing'); if (!el) return;
        const d = Math.abs(r - 74);
        el.setAttribute('r', r.toFixed(1)); el.setAttribute('stroke', d < 10 ? '#7CFC6A' : d < 24 ? '#B8F24A' : '#FFFFFF');
      },
      press(down) { if (!down) return; AU.sfx('throw'); const d = Math.abs(r - 74); if (d < 10) gameWin(true); else if (d < 24) gameWin(false); else gameMiss('빗나갔어요!'); },
      tap() { this.press(true); }
    };
  },
  sneak(nets, sp) {
    let p = 0, hold = false, state = 'calm', st = 1.4 + Math.random(), rust = 0;
    const speed = 26 + (3 - nets) * 4;
    const MAP = { calm: ['#7CFC6A', '먹이에 집중하고 있어요. 지금이에요!'], warn: ['#FFD23F', '더듬이가 움직여요!'], look: ['#FF6B5A', '이쪽을 보고 있어요! 손을 떼세요!'] };
    const set = (s, dur) => {
      state = s; st = dur;
      const el = $('#gState'); if (el) { el.style.background = MAP[s][0]; el.textContent = MAP[s][1]; }
      $('#encBug').classList.toggle('alert', s === 'look');
      if (s === 'warn') AU.sfx('rustle'); if (s === 'look') AU.sfx('buzz');
    };
    return {
      tip: '버튼을 꾹 누르고 있으면 살금살금 다가가요. 곤충이 이쪽을 보면 손을 떼세요!',
      html: `<span class="g-state" id="gState"></span><div class="g-label"><span>거리</span><span id="gPct">0%</span></div><div class="g-track"><div class="g-fill" id="gFill"></div></div><button type="button" class="g-btn" id="gBtn">꾹 눌러서 다가가기</button>`,
      bind() {
        set('calm', st);
        $('#encBug').style.transform = 'scale(.75)';
        const b = $('#gBtn'); b.setAttribute('data-quiet', '');
        b.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); AU.init(); this.press(true); });
        ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => b.addEventListener(ev, () => this.press(false)));
      },
      update(dt) {
        st -= dt;
        if (st <= 0) {
          if (state === 'calm') set('warn', .6);
          else if (state === 'warn') set('look', 1 + Math.random() * .6);
          else set('calm', Math.max(.6, 1 + Math.random() * 1.4 - (3 - nets) * .2));
        }
        if (hold) {
          if (state === 'look') { this.press(false); gameMiss(`들켰어요! ${sp.subj} 달아나려고 해요.`); return; }
          p = Math.min(100, p + speed * dt);
          rust -= dt; if (rust <= 0) { rust = .3; AU.sfx('step'); }
          $('#encBug').style.transform = `scale(${0.75 + p / 100 * 0.45})`;
          if (p >= 100) { this.press(false); gameWin(state === 'calm'); return; }
        }
        $('#gFill').style.width = p + '%'; $('#gPct').textContent = Math.round(p) + '%';
      },
      press(down) { hold = down; const b = $('#gBtn'); if (b) b.classList.toggle('down', down); }
    };
  },
  bar(nets, sp) {
    const w = 110 - (3 - nets) * 22, z0 = 60 + Math.random() * (640 - w - 120);
    let x = 0, v = 520 + (3 - nets) * 120;
    return {
      tip: '움직이는 표시가 초록 칸(곤충이 숨은 곳)에 들어왔을 때 멈추세요!',
      html: `<div class="g-track"><div class="g-zone" style="left:${z0}px;width:${w}px"></div><div class="g-mark" id="gMark"></div></div><button type="button" class="g-btn" id="gBtn">지금 멈추기!</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        x += v * dt; if (x > 640) { x = 640; v = -v; } if (x < 0) { x = 0; v = -v; }
        const m = $('#gMark'); if (m) m.style.left = x + 'px';
      },
      press(down) { if (!down) return; AU.sfx('throw'); const c = z0 + w / 2; if (x >= z0 && x <= z0 + w) gameWin(Math.abs(x - c) < w * .18); else gameMiss(`${sp.subj} 눈치챘어요!`); },
      tap() { this.press(true); }
    };
  },
  mash(nets, sp) {
    let p = 0, time = 5 - (3 - nets) * .5;

      html: `<div class="g-label"><span>${sp.mash ? sp.mash[0] : '껍질 벌리기'}</span><span id="gTime"></span></div><div class="g-track"><div class="g-fill" id="gFill"></div></div><button type="button" class="g-btn" id="gBtn">연타!</button>`,
      bind() { press('#gBtn', () => this.press(true)); },
      update(dt) {
        time -= dt; p = Math.max(0, p - 18 * dt);
        $('#gFill').style.width = p + '%'; $('#gTime').textContent = `남은 시간 ${Math.max(0, time).toFixed(1)}초`;
        if (time <= 0) gameMiss('시간이 다 됐어요!');
      },
      press(down) {
        if (!down) return; AU.sfx('tap'); p = Math.min(100, p + 8.5);
        $('#encBug').style.transform = `translateX(${(Math.random() - .5) * 12}px)`;

      },
      tap() { this.press(true); }
    };
  }
};

function bindJoy() {
  const j = $('#joy'); if (!j) return;
  let pid = null;
  const set = (dx, dy) => {
    const d = Math.hypot(dx, dy), k = d > JOY.r ? JOY.r / d : 1;
    dx *= k; dy *= k;
    $('#joyK').style.transform = `translate(${dx}px, ${dy}px)`;
    if (F) { const m = Math.hypot(dx, dy) / JOY.r; F.jx = m > .18 ? dx / JOY.r : 0; F.jy = m > .18 ? dy / JOY.r : 0; if (m > .18) F.tx = null; }
  };
  const move = (e) => { const p = toStage(e); set(p.x - JOY.cx, p.y - JOY.cy); };
  j.addEventListener('pointerdown', (e) => { e.stopPropagation(); e.preventDefault(); AU.init(); pid = e.pointerId; try { j.setPointerCapture(pid); } catch (_) {} move(e); });
  j.addEventListener('pointermove', (e) => { if (e.pointerId === pid) move(e); });
  const end = (e) => { if (e.pointerId !== pid) return; pid = null; set(0, 0); };

}

function aiFor(i) {
  const sd = B.sides[i], u = sd.team[sd.active];
  if (canUse(i, 'r') && Math.random() < .7) return { kind: 'skill', k: 'r' };
  if (u.hp / u.max < .5 && canUse(i, 'w') && Math.random() < .4) return { kind: 'skill', k: 'w' };
  if (canUse(i, 'e') && u.en >= 60 && Math.random() < .6) return { kind: 'skill', k: 'e' };

}
function allyTurn() {
  if (!B || B.over || B.phase !== 'choose') return;
  const P = B.sides[0], u = P.team[P.active];
  if (!u.ally) return;
  const turn = B.turn;
  setTimeout(() => {

function ensureTrades() {

<div class="text"><span class="chip">곤충 배틀 RPG</span><h1>인섹터스<br>리그</h1>
<p>잡고, 기르고, 붙는다.<br>동네 뒷산에서 세계 무대까지.</p>
<div class="menu">${sv ? `<button type="button" class="primary big" id="contBtn">이어하기 <small>${sv.day ? sv.day + '일째' : ''}</small></button>
<button type="button" id="setBtn">설정</button>

</div></div></div>`;
  let armNew = false;

function resume(sv) {

  S.lastWin = !!sv.lastWin;
  S.bugs = Array.isArray(sv.bugs) ? sv.bugs.map(cleanBug).filter(Boolean) : [];
  S.party = Array.isArray(sv.party) ? sv.party.map(String) : [];
  S.money = Math.max(0, sv.money | 0);
  S.items = {}; for (const k of [...Object.keys(ITEMS), ...Object.keys(SUBS).map((x) => 'sub_' + x), ...Object.keys(GEAR).map((x) => 'gear_' + x), 'antimold', 'med_kinshi', ...Object.keys(HELD).map((x) => 'held_' + x)]) S.items[k] = Math.max(0, (sv.items && sv.items[k]) | 0);
  S.day = Math.max(1, sv.day | 0 || 1);

  S.jars = Array.isArray(sv.jars) ? sv.jars.map((j) => ({ id: String(j.id || rid()), size: okS(j.size, JAR), egg: j.egg && SP[j.egg.sp] ? { ...(j.egg.med ? { med: j.egg.med === 'kinshi' ? 'kinshi' : 'g1' } : {}), sp: j.egg.sp, q: +j.egg.q || 0, stage: ['egg', 'larva', 'pupa', 'adult'].includes(j.egg.stage) ? j.egg.stage : 'egg', d: j.egg.d | 0, ...(cleanPar(j.egg.par) ? { par: cleanPar(j.egg.par) } : {}) } : null })) : [];
  S.eggs = Array.isArray(sv.eggs) ? sv.eggs.filter((e) => e && SP[e.sp]).map((e) => ({ id: String(e.id || rid()), sp: e.sp, q: +e.q || 0, day: e.day | 0, ...(cleanPar(e.par) ? { par: cleanPar(e.par) } : {}) })) : [];
  S.goal = sv.goal && sv.goal.day ? { name: String(sv.goal.name || '리그'), day: sv.goal.day | 0 } : null;
  S.teamName = typeof sv.teamName === 'string' ? sv.teamName.slice(0, 12) : '';
  S.lastDp = typeof sv.lastDp === 'number' ? sv.lastDp : (sv.day > 1 ? SCRIPT.findIndex((c) => c.t === 'daypass') : -1);
  S.deco = {}; if (sv.deco) for (const k in DECO) if (sv.deco[k]) S.deco[k] = true;
  S.wx = WX[sv.wx] ? sv.wx : 'sun'; S.st = sv.st && typeof sv.st === 'object' ? sv.st : {}; ensureSt();
  S.dm = sv.dm && sv.dm.day && Array.isArray(sv.dm.idx) && sv.dm.idx.every((i) => DM_POOL[i]) ? { day: sv.dm.day | 0, idx: sv.dm.idx, base: sv.dm.base || {}, got: Array.isArray(sv.dm.got) ? sv.dm.got : [], all: !!sv.dm.all } : null;
  S.ach = Array.isArray(sv.ach) ? sv.ach.filter((x) => ACH.some((a) => a.id === x)) : []; S.dexRw = Array.isArray(sv.dexRw) ? sv.dexRw.map(String) : [];
  S.rank = sv.rank && typeof sv.rank === 'object' ? { t: sv.rank.t | 0, s: sv.rank.s | 0, w: sv.rank.w | 0, best: sv.rank.best | 0, streak: sv.rank.streak | 0, top: sv.rank.top | 0, opp: null } : null; ensureRank();
  S.freeDay = typeof sv.freeDay === 'number' ? sv.freeDay : undefined; monthMemo = { ip: -1, m: 3 };
  S.cw = typeof sv.cw === 'number' ? sv.cw : -1; S.cbest = sv.cbest && SP[sv.cbest.id] ? { score: +sv.cbest.score || 0, id: sv.cbest.id, mm: +sv.cbest.mm || 0 } : null;

/* ---------- 입력 ---------- */
stage.addEventListener('pointerdown', (e) => {
  AU.init();
  if (e.target.closest('button') || e.target.closest('.joy')) return;

    const k = { KeyA: 'a', KeyQ: 'q', KeyW: 'w', KeyE: 'e', KeyR: 'r' }[e.code];

  }

showLoading();
})();
